plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.algorand.perarn.peragoogleauth'
version = '0.1.0'

android {
  namespace "com.algorand.perarn.peragoogleauth"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "com.google.android.gms:play-services-auth:21.4.0"
}
