plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.algorand.perarn.perabiometricbinding'
version = '0.1.0'

android {
  namespace "com.algorand.perarn.perabiometricbinding"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Matched to the version expo-local-authentication already pulls in, so the
  // app resolves a single androidx.biometric.
  implementation 'androidx.biometric:biometric:1.2.0-alpha04'
}
