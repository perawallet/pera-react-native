---
format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: react-native
app:
  envs:
  - BITRISE_SCHEME_STAGING: Pera7Staging
  - BITRISE_SCHEME_PRODUCTION: PeraAlgoWallet
pipelines:
  # Staging and production are split across two pipelines rather than built
  # together on every tag: four build machines a night (two of them
  # g2.mac.large) is what sent Bitrise usage through the roof.
  #
  # The smoke gate rides along with staging because only the staging builds
  # bake DISABLE_SCREEN_CAPTURE_PREVENTION, and Appium cannot drive a
  # FLAG_SECURE surface — a production build hangs rather than failing
  # usefully. So the gate is nightly-only, and an rc is covered by the
  # nightlies it descends from rather than directly.
  #
  # Neither pipeline sets abort_on_fail, and that default is load-bearing: it
  # is what keeps a red iOS smoke gate from killing the Android build running
  # beside it. should_always_run on notify is the matching half — the card
  # still posts when a build it depends on failed.
  nightly-builds:
    workflows:
      test: {}
      generate-changelog: {}
      ios-staging:
        depends_on:
        - test
      android-staging:
        depends_on:
        - test
        - generate-changelog
      notify-nightly:
        depends_on:
        # `test` is listed even though the builds already gate on it — shared
        # pipeline variables only reach dependent workflows, and without it
        # TEST_STATUS would never arrive here.
        - test
        - generate-changelog
        - ios-staging
        - android-staging
        should_always_run: workflow
    triggers:
      tag:
      - name:
          regex: "^v[0-9]+\\.[0-9]+\\.[0-9]+-alpha\\.[0-9]+$"
  release-builds:
    workflows:
      test: {}
      generate-changelog: {}
      ios-production:
        depends_on:
        - test
      android-production:
        depends_on:
        - test
        - generate-changelog
      notify-release:
        depends_on:
        # See nightly-builds for why `test` is listed here.
        - test
        - generate-changelog
        - ios-production
        - android-production
        should_always_run: workflow
    triggers:
      tag:
      # rc and stable both cut production builds; only the suffix differs.
      - name:
          regex: "^v[0-9]+\\.[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?$"
  web-release-builds:
    description: Build the browser extension (Web) zip for staging + production.
      Manual-trigger only for now — no automatic tag/nightly trigger, and no
      Chrome Web Store upload.
    workflows:
      test: {}
      generate-changelog: {}
      web-production:
        depends_on:
        - test
      web-staging:
        depends_on:
        - test
      notify-release-web:
        depends_on:
        # `test` is listed even though the two builds already gate on it —
        # shared pipeline variables only reach dependent workflows, and
        # without it TEST_STATUS would never arrive here.
        - test
        - generate-changelog
        - web-production
        - web-staging
        should_always_run: workflow
workflows:
  test:
    description: Run tests before release
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
    envs:
    # Deliberately NOT production. This workflow runs `pnpm test` and nothing
    # else — validate-env.sh's `test` profile requires no secrets, and the
    # workflow never runs setup-env-secrets.sh, so the per-environment secrets
    # are unset here. With ENVIRONMENT=production the Generate Config step
    # exported APP_ENV=production, and generate-config.sh then (correctly)
    # refused to bake a production config that would fall back to the staging
    # backend URLs. Tests don't need production config — GitHub Actions runs the
    # same suite with APP_ENV unset — and handing a test job the production
    # secrets just to satisfy the guard would widen their exposure for nothing.
    - VALIDATE_PROFILE: test
    # Publishes TEST_STATUS so the release cards can show a red Tests row
    # instead of rendering the gated builds as a benign "skipped".
    - ROW_ID: TEST
    steps:
    - git-clone@8: {}
    - script@1:
        title: Validate environment
        inputs:
        - content: |
            #!/usr/bin/env bash
            ./tools/validate-env.sh
    - restore-cache@3:
        inputs:
        - key: node-modules-{{ checksum "pnpm-lock.yaml" }}
    # `.tool-versions` is asdf-format (`nodejs 22`), which the nvm step's
    # node_version_file does not parse — it silently fell through to the
    # stack default (Node 26) while GitHub Actions' setup-node read the same
    # file correctly and used Node 22. Node >=24 ships an inert Web Storage
    # `globalThis.localStorage`, which makes vitest's jsdom environment skip
    # copying jsdom's own, so `window.localStorage` came back undefined only
    # here. Resolve the pin explicitly and hand nvm an exact version.
    - script@1:
        title: Resolve pinned Node version
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -euo pipefail
            NODE_VERSION=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)
            if [ -z "$NODE_VERSION" ]; then
              echo "No 'nodejs' pin found in .tool-versions"
              exit 1
            fi
            envman add --key NODE_VERSION --value "$NODE_VERSION"
    - nvm@1:
        inputs:
        - node_version: "$NODE_VERSION"
    - script@1:
        title: Install pnpm
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            # Fail loudly if nvm handed us a different major than the repo
            # pins. A silent drift here changes host globals under the test
            # suite (see the Node version note above) and is otherwise only
            # visible as an unrelated-looking test failure.
            ACTIVE_NODE_MAJOR=$(node -p "process.versions.node.split('.')[0]")
            if [ "$ACTIVE_NODE_MAJOR" != "$NODE_VERSION" ]; then
              echo "Node ${ACTIVE_NODE_MAJOR} is active but .tool-versions pins ${NODE_VERSION}"
              exit 1
            fi
            # Pin to the repo's packageManager version — an unpinned
            # `npm i -g pnpm` floats to latest and a pnpm major release
            # would change lockfile/hoisting behavior under the release
            # builds without any repo change. split('+') strips a Corepack
            # hash suffix (e.g. pnpm@10.28.1+sha512-…) that npm can't install.
            PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")
            npm install -g "pnpm@${PNPM_VERSION}"
    - script@1:
        title: Install dependencies
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            pnpm install --frozen-lockfile --prefer-offline
    - save-cache@1:
        inputs:
        - key: node-modules-{{ checksum "pnpm-lock.yaml" }}
        - paths: |-
            node_modules
            apps/mobile/node_modules
            packages/*/node_modules
    - script@1:
        title: Generate Config
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            # APP_ENV must be set here so generate-config.sh bakes
            # appEnvironment into the bundled config (defaults to development).
            export APP_ENV="${ENVIRONMENT:-development}"
            pnpm run generate:config
    - script@1:
        title: Run Tests
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            pnpm run test
    after_run:
    - _publish-result
  generate-changelog:
    description: Generate the release changelog once and share it with the build workflows
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: g2.linux.medium
    steps:
    - git-clone@8:
        inputs:
        - fetch_tags: 'yes'
        - clone_depth: -1
    - script@1:
        title: Generate Changelog
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -e

            # Changelog is best-effort: never fail the release over it.
            #
            # Which tag to diff against is one rule shared with the delivered-
            # ticket list, so it lives in a script rather than being spelled out
            # here — see tools/release-range-start.sh for why alpha and rc need
            # per-channel ranges and why a store release must not fall back.
            LAST_TAG=$(./tools/release-range-start.sh "${BITRISE_GIT_TAG:-}" || echo "")
            if [ -n "$LAST_TAG" ]; then
              echo "Generating changelog since tag: $LAST_TAG"
              CHANGELOG=$(./tools/generate_changelog.sh "$LAST_TAG" || echo "")
              # Same range, unabridged and without Slack markup: the card only
              # ever shows a summary, so this file is the record of what
              # actually shipped and is what the card's link points at.
              FULL=$(LINK_FORMAT=plain MAX_COUNT=0 ./tools/generate_changelog.sh "$LAST_TAG" || echo "")
            fi
            if [ -z "${CHANGELOG:-}" ]; then
              echo "No previous tag / empty changelog; using fallback"
              CHANGELOG="Release build - see git history for changes"
            fi

            ARTIFACT_NAME="changelog-${BITRISE_GIT_TAG:-b$BITRISE_BUILD_NUMBER}.md"
            printf '%s\n' "${FULL:-$CHANGELOG}" >"${BITRISE_DEPLOY_DIR}/${ARTIFACT_NAME}"
            envman add --key CHANGELOG_ARTIFACT_NAME --value "$ARTIFACT_NAME"

            # Slack drops the whole payload with `invalid_attachments` once a
            # section block passes 3000 chars, which is what killed the RC
            # cards. Cap before the escape below — cutting escaped text can
            # split a \n or \" in half. See tools/cap-changelog.sh.
            CHANGELOG=$(printf '%s' "$CHANGELOG" | ./tools/cap-changelog.sh 2500)

            # JSON-escape (newlines -> \n, quotes) so the changelog embeds
            # cleanly in the Slack payload "text" field; without it the raw
            # newlines collapse the list (and section headers) onto one line.
            CHANGELOG=$(printf '%s' "$CHANGELOG" | jq -Rs . | sed 's/^"//;s/"$//')

            envman add --key CHANGELOG --value "$CHANGELOG"
    - deploy-to-bitrise-io@2:
        inputs:
        - notify_user_groups: none
        - is_enable_public_page: 'false'
    - script@1:
        title: Capture changelog artifact URL
        inputs:
        - content: |
            #!/usr/bin/env bash
            # set -e without -x: keep temporary S3 download signatures out of the trace log.
            set -e
            # Map entries are `name=>url` joined by `|` — same shape the web
            # build parses for its zip. A glob rather than a regex: the
            # filename carries dots from the version.
            URL=""
            if [ -n "${BITRISE_PERMANENT_DOWNLOAD_URL_MAP:-}" ]; then
              IFS='|' read -ra ENTRIES <<< "$BITRISE_PERMANENT_DOWNLOAD_URL_MAP"
              for entry in "${ENTRIES[@]}"; do
                case "$entry" in
                  "${CHANGELOG_ARTIFACT_NAME}=>"*)
                    URL="${entry#*=>}"
                    break
                    ;;
                esac
              done
            fi
            # Empty is tolerated: the card omits the link rather than failing
            # the release over a changelog upload.
            envman add --key CHANGELOG_URL --value "$URL"
    - share-pipeline-variable@1:
        inputs:
        - variables: |-
            CHANGELOG
            CHANGELOG_URL
  ios-staging:
    description: Build and deploy iOS Staging to TestFlight
    envs:
    - ENVIRONMENT: staging
    - APP_ENV: staging
    - DISABLE_SCREEN_CAPTURE_PREVENTION: 'true'
    - BITRISE_SCHEME: "$BITRISE_SCHEME_STAGING"
    - USE_CACHE: 'true'
    - VALIDATE_PROFILE: ios
    - ROW_ID: IOS_STAGING
    # The gate drives this workflow's own artifact — ios-staging already bakes
    # DISABLE_SCREEN_CAPTURE_PREVENTION, so no second build is needed.
    - RUN_SMOKE: 'true'
    after_run:
    - _ios-build
    # After _publish-result, not before: that step snapshots
    # BITRISE_BUILD_STATUS, so the staging row stays green when the build and
    # the TestFlight upload succeeded and only the gate went red.
    - _publish-result
    - _smoke-ios
    meta:
      bitrise.io:
        stack: osx-xcode-26.2.x
        machine_type_id: g2.mac.large
  ios-production:
    description: Build and deploy iOS Production to TestFlight
    envs:
    - ENVIRONMENT: production
    - APP_ENV: production
    - BITRISE_SCHEME: "$BITRISE_SCHEME_PRODUCTION"
    - USE_CACHE: 'false'
    - VALIDATE_PROFILE: ios
    - ROW_ID: IOS_PRODUCTION
    after_run:
    - _ios-build
    - _publish-result
    meta:
      bitrise.io:
        stack: osx-xcode-26.2.x
        machine_type_id: g2.mac.large
  _ios-build:
    steps:
    - git-clone@8:
        inputs:
        - fetch_tags: 'yes'
        - clone_depth: -1
    - script@1:
        title: Validate environment
        inputs:
        - content: |
            #!/usr/bin/env bash
            ./tools/validate-env.sh
    - script@1:
        title: Install Ruby via asdf
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            asdf plugin add ruby || true
            asdf install ruby
    - restore-cache@3:
        inputs:
        - key: bundler-{{ checksum "apps/mobile/Gemfile.lock" }}
    - script@1:
        title: Install Bundler gems
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            cd apps/mobile
            bundle install
    - save-cache@1:
        inputs:
        - key: bundler-{{ checksum "apps/mobile/Gemfile.lock" }}
        - paths: apps/mobile/vendor/bundle
    - restore-cache@3:
        inputs:
        # Key on BOTH pnpm-lock.yaml AND .npmrc, exact match only (no bare-prefix
        # fallback). Two independent inputs decide the node_modules layout:
        #   - pnpm-lock.yaml pins versions;
        #   - .npmrc's public-hoist-pattern controls which packages get hoisted to
        #     the root (e.g. @expo/config-plugins, which @react-native-firebase/app's
        #     config plugin require()s WITHOUT declaring — see EXConstants
        #     "Generate app.config" archive failures, PR #1015).
        # A .npmrc hoist change does NOT change pnpm-lock.yaml, so keying on the
        # lock alone restores a tree missing the hoist symlink, and
        # `pnpm install --frozen-lockfile` no-ops over it (2s) instead of healing
        # it. A bare-prefix fallback compounds this by seeding the new key from an
        # unrelated tree. Both inputs in the key; any change forces a fresh install.
        - key: node-modules-ios-{{ checksum "pnpm-lock.yaml" }}-{{ checksum ".npmrc" }}
    # `.tool-versions` is asdf-format (`nodejs 22`), which the nvm step's
    # node_version_file does not parse — it silently fell through to the
    # stack default (Node 26) while GitHub Actions' setup-node read the same
    # file correctly and used Node 22. Node >=24 ships an inert Web Storage
    # `globalThis.localStorage`, which makes vitest's jsdom environment skip
    # copying jsdom's own, so `window.localStorage` came back undefined only
    # here. Resolve the pin explicitly and hand nvm an exact version.
    - script@1:
        title: Resolve pinned Node version
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -euo pipefail
            NODE_VERSION=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)
            if [ -z "$NODE_VERSION" ]; then
              echo "No 'nodejs' pin found in .tool-versions"
              exit 1
            fi
            envman add --key NODE_VERSION --value "$NODE_VERSION"
    - nvm@1:
        inputs:
        - node_version: "$NODE_VERSION"
    - script@1:
        title: Install pnpm
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            # Fail loudly if nvm handed us a different major than the repo
            # pins. A silent drift here changes host globals under the test
            # suite (see the Node version note above) and is otherwise only
            # visible as an unrelated-looking test failure.
            ACTIVE_NODE_MAJOR=$(node -p "process.versions.node.split('.')[0]")
            if [ "$ACTIVE_NODE_MAJOR" != "$NODE_VERSION" ]; then
              echo "Node ${ACTIVE_NODE_MAJOR} is active but .tool-versions pins ${NODE_VERSION}"
              exit 1
            fi
            # Pin to the repo's packageManager version — an unpinned
            # `npm i -g pnpm` floats to latest and a pnpm major release
            # would change lockfile/hoisting behavior under the release
            # builds without any repo change. split('+') strips a Corepack
            # hash suffix (e.g. pnpm@10.28.1+sha512-…) that npm can't install.
            PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")
            npm install -g "pnpm@${PNPM_VERSION}"
    - script@1:
        title: Install dependencies
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            pnpm install --frozen-lockfile --prefer-offline
    - save-cache@1:
        inputs:
        - key: node-modules-ios-{{ checksum "pnpm-lock.yaml" }}-{{ checksum ".npmrc" }}
        - paths: |-
            node_modules
            apps/mobile/node_modules
            packages/*/node_modules
    - script@1:
        title: Setup Env Secrets
        inputs:
        - content: |
            #!/usr/bin/env bash
            ./tools/setup-env-secrets.sh
    - script@1:
        title: Generate Config
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            # APP_ENV must be set here so generate-config.sh bakes
            # appEnvironment into the bundled config (defaults to development).
            export APP_ENV="${ENVIRONMENT:-development}"
            pnpm run generate:config
    - script@1:
        title: Build packages
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            # build:packages re-runs generate-config.sh, which bakes
            # appEnvironment from APP_ENV. Derive it from ENVIRONMENT here
            # (step shells don't inherit prior steps' exports) or the
            # bundled appEnvironment silently falls back to development.
            export APP_ENV="${ENVIRONMENT:-development}"
            pnpm run build:packages
    - script@1:
        title: Inject Google Service Info
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -e
            # no -x: keep the decoded secret out of the build trace log
            echo "$IOS_GOOGLE_SERVICE_INFO_BASE64" | base64 --decode > apps/mobile/config/GoogleService-Info.plist
    - restore-cache@3:
        inputs:
        # Keyed on pnpm-lock.yaml, not Podfile.lock: apps/mobile/ios is gitignored
        # and generated by the prebuild step BELOW, so a Podfile.lock checksum
        # cannot resolve here and the key would fall through to a bare prefix —
        # restoring a Pods/ (incl. ExpoModulesCore.xcframework) built from an
        # unrelated dependency set. `prebuild --no-clean` keeps it, and linking a
        # freshly compiled module against stale Expo headers aborts at launch with
        # a dyld missing-symbol. No prefix fallback for the same reason: nothing
        # reconciles Pods/ after restore the way pnpm install reconciles node_modules.
        - key: ios-pods-{{ checksum "pnpm-lock.yaml" }}
    # Must precede Expo Prebuild: app.config.builder.js reads APP_VERSION /
    # BUILD_NUMBER to bake the version into the generated native project. Same
    # ordering as the Android workflow — keep the two in step.
    - script@1:
        title: Resolve marketing version (tag-driven)
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            # Marketing version: the git tag is the source of truth (strip
            # leading v + any -prerelease suffix). Fall back to package.json
            # for manual/non-tag builds.
            if [ -n "$BITRISE_GIT_TAG" ]; then
              VERSION="${BITRISE_GIT_TAG#v}"
              VERSION="${VERSION%%-*}"
            else
              VERSION=$(jq -r '.version | split("-")[0]' apps/mobile/package.json)
            fi
            envman add --key APP_VERSION --value "$VERSION"
            envman add --key BUILD_NUMBER --value "$BITRISE_BUILD_NUMBER"
    - script@1:
        title: Expo Prebuild
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            export APP_ENV=$ENVIRONMENT
            pnpm --filter mobile expo:prebuild
    - save-cache@1:
        inputs:
        - key: ios-pods-{{ checksum "pnpm-lock.yaml" }}
        - paths: apps/mobile/ios/Pods
    - restore-cache@3:
        run_if: '{{enveq "USE_CACHE" "true"}}'
        inputs:
        # Exact key only. A prefix fallback here restores compiled objects built
        # against a different dependency set, which is the same mixed-ABI hazard
        # as the Pods cache above.
        - key: ios-derived-data-$BITRISE_SCHEME-{{ checksum "apps/mobile/ios/Podfile.lock"
            }}-{{ checksum "pnpm-lock.yaml" }}
    # Deprecated, but kept deliberately: it unconditionally installs the
    # uploaded certs + profiles that fastlane pins by name (CODE_SIGN_STYLE=
    # Manual). Its replacement, manage-ios-code-signing, only installs the
    # uploaded profiles as an ASC-API *fallback* and can't see the AutoFill
    # extension target, so the archive fails with "No profile ... found".
    - certificate-and-profile-installer@1: {}
    - script@1:
        title: Build & Deploy iOS
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            cd apps/mobile

            # Write API key to file (disable trace so the key isn't logged)
            set +x
            echo "$APP_STORE_CONNECT_API_KEY_CONTENT" > api_key.p8
            export APP_STORE_CONNECT_API_KEY_CONTENT=$(cat api_key.p8)
            set -x

            # Determine if we should clean
            CLEAN="true"
            if [ "$USE_CACHE" == "true" ]; then
              CLEAN="false"
            fi

            bundle exec fastlane ios deploy_testflight scheme:$BITRISE_SCHEME clean:$CLEAN
    - save-cache@1:
        run_if: '{{enveq "USE_CACHE" "true"}}'
        inputs:
        - key: ios-derived-data-$BITRISE_SCHEME-{{ checksum "apps/mobile/ios/Podfile.lock"
            }}-{{ checksum "pnpm-lock.yaml" }}
        - paths: "~/Library/Developer/Xcode/DerivedData"
    - script@1:
        is_always_run: true
        title: Collect signed artifact
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            # Surface the signed IPA as a downloadable build artifact — it's
            # otherwise only piped to TestFlight and discarded. Copying it
            # into $BITRISE_DEPLOY_DIR makes deploy-to-bitrise-io upload it.
            # is_always_run: the binary is built before the upload, so a
            # failed TestFlight upload should still yield a downloadable IPA.
            IPA="apps/mobile/build/ios/${BITRISE_SCHEME}.ipa"
            if [ ! -f "$IPA" ]; then
              echo "No IPA at $IPA — skipping artifact collection"
              exit 0
            fi
            SHA="$(printf '%s' "${BITRISE_GIT_COMMIT:-$GIT_CLONE_COMMIT_HASH}" | cut -c1-7)"
            NAME="pera-ios-${BITRISE_GIT_TAG:-${APP_VERSION:-b$BITRISE_BUILD_NUMBER}}-${SHA:-b$BITRISE_BUILD_NUMBER}"
            DEST="${BITRISE_DEPLOY_DIR}/${NAME}.ipa"
            cp "$IPA" "$DEST"
            envman add --key BITRISE_IPA_PATH --value "$DEST"
            # Retain the dSYM bundle(s) as artifacts too — Bitrise otherwise
            # discards them with the VM, leaving no way to re-symbolicate a
            # shipped build. gym names the zip after the app product, not the
            # scheme, so glob rather than hardcode.
            for DSYM in apps/mobile/build/ios/*.dSYM.zip; do
              [ -f "$DSYM" ] || continue
              cp "$DSYM" "${BITRISE_DEPLOY_DIR}/${NAME}-$(basename "$DSYM")"
            done
    - deploy-to-bitrise-io@2:
        is_always_run: true
        inputs:
        - notify_user_groups: none
        - is_enable_public_page: 'true'
    - script@1:
        is_always_run: true
        title: Capture artifact URLs
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            # BITRISE_PUBLIC_INSTALL_PAGE_URL is set by deploy-to-bitrise-io
            envman add --key INSTALL_PAGE_URL --value "${BITRISE_PUBLIC_INSTALL_PAGE_URL:-}"
  android-staging:
    description: Build and deploy Android Staging to Firebase App Distribution
    envs:
    - ENVIRONMENT: staging
    - APP_ENV: staging
    - DISABLE_SCREEN_CAPTURE_PREVENTION: 'true'
    - ANDROID_FLAVOR: staging
    - ANDROID_PACKAGE_NAME: com.algorand.perarn.staging
    - USE_CACHE: 'true'
    - DISTRIBUTION: firebase
    - VALIDATE_PROFILE: android
    - ROW_ID: ANDROID_STAGING
    # See ios-staging.
    - RUN_SMOKE: 'true'
    after_run:
    - _android-build
    - _publish-result
    - _smoke-android
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
  android-production:
    description: Build and deploy Android Production to Play Store Internal
    envs:
    - ENVIRONMENT: production
    - APP_ENV: production
    - ANDROID_FLAVOR: production
    - ANDROID_PACKAGE_NAME: com.algorand.android
    - USE_CACHE: 'false'
    - DISTRIBUTION: firebase
    - VALIDATE_PROFILE: android
    - ROW_ID: ANDROID_PRODUCTION
    after_run:
    - _android-build
    - _publish-result
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
  _android-build:
    steps:
    - git-clone@8:
        inputs:
        - fetch_tags: 'yes'
        - clone_depth: -1
    - script@1:
        title: Validate environment
        inputs:
        - content: |
            #!/usr/bin/env bash
            ./tools/validate-env.sh
    - script@1:
        title: Generate Changelog (if not from pipeline)
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex

            # Skip if CHANGELOG was already set by a prior stage
            if [ -n "$CHANGELOG" ]; then
              echo "Changelog already set from pipeline, skipping generation"
              exit 0
            fi

            echo "Generating changelog (not available from pipeline)"

            # Changelog is best-effort (same contract as the
            # generate-changelog workflow): never fail the build over it.
            LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              echo "Generating changelog since tag: $LAST_TAG"
              CHANGELOG=$(./tools/generate_changelog.sh "$LAST_TAG" || echo "")
            fi
            if [ -z "${CHANGELOG:-}" ]; then
              echo "No previous tag / empty changelog; using fallback"
              CHANGELOG="Release build - see git history for changes"
            fi

            # JSON-escape (newlines -> \n, quotes) so the changelog embeds
            # cleanly in the Slack payload "text" field; without it the raw
            # newlines collapse the list (and section headers) onto one line.
            CHANGELOG=$(printf '%s' "$CHANGELOG" | jq -Rs . | sed 's/^"//;s/"$//')

            envman add --key CHANGELOG --value "$CHANGELOG"
    - script@1:
        title: Install Ruby via asdf
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            asdf plugin add ruby || true
            asdf install ruby
    - restore-cache@3:
        inputs:
        - key: bundler-{{ checksum "apps/mobile/Gemfile.lock" }}
    - script@1:
        title: Install Bundler gems
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            cd apps/mobile
            bundle install
    - save-cache@1:
        inputs:
        - key: bundler-{{ checksum "apps/mobile/Gemfile.lock" }}
        - paths: apps/mobile/vendor/bundle
    - restore-cache@3:
        inputs:
        - key: node-modules-{{ checksum "pnpm-lock.yaml" }}
    # `.tool-versions` is asdf-format (`nodejs 22`), which the nvm step's
    # node_version_file does not parse — it silently fell through to the
    # stack default (Node 26) while GitHub Actions' setup-node read the same
    # file correctly and used Node 22. Node >=24 ships an inert Web Storage
    # `globalThis.localStorage`, which makes vitest's jsdom environment skip
    # copying jsdom's own, so `window.localStorage` came back undefined only
    # here. Resolve the pin explicitly and hand nvm an exact version.
    - script@1:
        title: Resolve pinned Node version
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -euo pipefail
            NODE_VERSION=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)
            if [ -z "$NODE_VERSION" ]; then
              echo "No 'nodejs' pin found in .tool-versions"
              exit 1
            fi
            envman add --key NODE_VERSION --value "$NODE_VERSION"
    - nvm@1:
        inputs:
        - node_version: "$NODE_VERSION"
    - script@1:
        title: Install pnpm
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            # Fail loudly if nvm handed us a different major than the repo
            # pins. A silent drift here changes host globals under the test
            # suite (see the Node version note above) and is otherwise only
            # visible as an unrelated-looking test failure.
            ACTIVE_NODE_MAJOR=$(node -p "process.versions.node.split('.')[0]")
            if [ "$ACTIVE_NODE_MAJOR" != "$NODE_VERSION" ]; then
              echo "Node ${ACTIVE_NODE_MAJOR} is active but .tool-versions pins ${NODE_VERSION}"
              exit 1
            fi
            # Pin to the repo's packageManager version — an unpinned
            # `npm i -g pnpm` floats to latest and a pnpm major release
            # would change lockfile/hoisting behavior under the release
            # builds without any repo change. split('+') strips a Corepack
            # hash suffix (e.g. pnpm@10.28.1+sha512-…) that npm can't install.
            PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")
            npm install -g "pnpm@${PNPM_VERSION}"
    - script@1:
        title: Install dependencies
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            pnpm install --frozen-lockfile --prefer-offline
    - save-cache@1:
        inputs:
        - key: node-modules-{{ checksum "pnpm-lock.yaml" }}
        - paths: |-
            node_modules
            apps/mobile/node_modules
            packages/*/node_modules
    - script@1:
        title: Setup Env Secrets
        inputs:
        - content: |
            #!/usr/bin/env bash
            ./tools/setup-env-secrets.sh
    - script@1:
        title: Generate Config
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            # APP_ENV must be set here so generate-config.sh bakes
            # appEnvironment into the bundled config (defaults to development).
            export APP_ENV="${ENVIRONMENT:-development}"
            pnpm run generate:config
    - script@1:
        title: Build packages
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            # build:packages re-runs generate-config.sh, which bakes
            # appEnvironment from APP_ENV. Derive it from ENVIRONMENT here
            # (step shells don't inherit prior steps' exports) or the
            # bundled appEnvironment silently falls back to development.
            export APP_ENV="${ENVIRONMENT:-development}"
            pnpm run build:packages
    - script@1:
        title: Inject Google Services JSON
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -e
            # no -x: keep the decoded secret out of the build trace log
            echo "$ANDROID_GOOGLE_SERVICES_BASE64" | base64 --decode > apps/mobile/config/google-services.json
    - script@1:
        title: Resolve marketing version (tag-driven)
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            # Marketing version: the git tag is the source of truth (strip
            # leading v + any -prerelease suffix). Fall back to package.json
            # for manual/non-tag builds.
            if [ -n "$BITRISE_GIT_TAG" ]; then
              VERSION="${BITRISE_GIT_TAG#v}"
              VERSION="${VERSION%%-*}"
            else
              VERSION=$(jq -r '.version | split("-")[0]' apps/mobile/package.json)
            fi
            envman add --key APP_VERSION --value "$VERSION"
            envman add --key BUILD_NUMBER --value "$((BITRISE_BUILD_NUMBER + ${BUILD_NUMBER_OFFSET:-0}))"
    - script@1:
        title: Expo Prebuild
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            export APP_ENV=$ENVIRONMENT
            pnpm --filter mobile expo:prebuild

            # Increase Gradle JVM memory to avoid OOM
            # We use envman to make sure it persists for the Fastlane step
            envman add --key GRADLE_OPTS --value "-Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1g' -Dorg.gradle.daemon=false"
    - restore-cache@3:
        inputs:
        - key: |-
            android-gradle-{{ checksum "pnpm-lock.yaml" }}-{{ checksum "apps/mobile/android/build.gradle" }}
            android-gradle-
    - script@1:
        title: Install and configure ccache
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            sudo apt-get update
            sudo apt-get install -y ccache
            mkdir -p $HOME/.ccache
            ccache --set-config=max_size=2G
            ccache --set-config=compression=true
            echo "NDK_CCACHE=ccache" >> $BITRISE_SOURCE_DIR/.env
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $BITRISE_SOURCE_DIR/.env
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $BITRISE_SOURCE_DIR/.env
    - restore-cache@3:
        inputs:
        - key: |-
            android-ccache-{{ checksum "pnpm-lock.yaml" }}
            android-ccache-
    - set-java-version@1:
        inputs:
        - java_version: '17'
    - script@1:
        title: Install Java via asdf
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            asdf plugin add java || true
            asdf install java
            # Set JAVA_HOME for Gradle
            JAVA_HOME=$(asdf where java)
            envman add --key JAVA_HOME --value "$JAVA_HOME"
    - script@1:
        title: Android KeyStore
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -e
            # no -x: keep the decoded keystore out of the build trace log
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/mobile/config/release.keystore
    - script@1:
        title: Resolve distribution channel
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            # Channel logic lives in tools/resolve-distribution.sh so the
            # validate step and this step can't drift (see that script).
            envman add --key DISTRIBUTION --value "$(./tools/resolve-distribution.sh)"
    - script@1:
        title: Setup distribution credentials
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -e
            # no -x: keep the decoded credentials out of the build trace log

            # deploy_internal (play: rc/stable) uploads the AAB to Play AND
            # an APK to Firebase, so the play path needs BOTH credentials.
            # deploy_firebase needs only the Firebase service account.
            echo "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > apps/mobile/config/firebase-service-account.json
            if [ "$DISTRIBUTION" != "firebase" ]; then
              echo "$ANDROID_JSON_KEY_FILE" > apps/mobile/config/api-key.json
            fi
    - script@1:
        title: Build & Deploy Android
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            cd apps/mobile

            # Set release notes from changelog
            export RELEASE_NOTES="$CHANGELOG"

            # Determine if we should clean
            CLEAN="true"
            if [ "$USE_CACHE" == "true" ]; then
              CLEAN="false"
            fi

            if [ "$DISTRIBUTION" == "firebase" ]; then
              bundle exec fastlane android deploy_firebase flavor:$ANDROID_FLAVOR clean:$CLEAN
            else
              bundle exec fastlane android deploy_internal flavor:$ANDROID_FLAVOR clean:$CLEAN
            fi
    - save-cache@1:
        inputs:
        - key: android-gradle-{{ checksum "pnpm-lock.yaml" }}-{{ checksum
            "apps/mobile/android/build.gradle" }}
        - paths: |-
            ~/.gradle/caches
            ~/.gradle/wrapper
    - save-cache@1:
        inputs:
        - key: android-ccache-{{ checksum "pnpm-lock.yaml" }}
        - paths: "~/.ccache"
    - script@1:
        is_always_run: true
        title: Collect signed artifacts
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            # Surface the signed AAB/APK as downloadable build artifacts —
            # they're otherwise only piped to Play/Firebase and discarded.
            # Copying into $BITRISE_DEPLOY_DIR makes deploy-to-bitrise-io
            # upload them. deploy_internal produces both; deploy_firebase, an APK.
            # is_always_run: the AAB is built before the Play upload, so a
            # failed upload (e.g. a Play policy gate) still yields the AAB.
            SHA="$(printf '%s' "${BITRISE_GIT_COMMIT:-$GIT_CLONE_COMMIT_HASH}" | cut -c1-7)"
            BASE="pera-android-${BITRISE_GIT_TAG:-${APP_VERSION:-b$BITRISE_BUILD_NUMBER}}-${SHA:-b$BITRISE_BUILD_NUMBER}"
            AAB="apps/mobile/android/app/build/outputs/bundle/release/app-release.aab"
            APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
            if [ -f "$AAB" ]; then
              cp "$AAB" "${BITRISE_DEPLOY_DIR}/${BASE}.aab"
              envman add --key BITRISE_AAB_PATH --value "${BITRISE_DEPLOY_DIR}/${BASE}.aab"
            fi
            if [ -f "$APK" ]; then
              cp "$APK" "${BITRISE_DEPLOY_DIR}/${BASE}.apk"
              envman add --key BITRISE_APK_PATH --value "${BITRISE_DEPLOY_DIR}/${BASE}.apk"
            fi
            if [ ! -f "$AAB" ] && [ ! -f "$APK" ]; then
              echo "No AAB/APK found — skipping artifact collection"
            fi
    - deploy-to-bitrise-io@2:
        is_always_run: true
        inputs:
        - notify_user_groups: none
        - is_enable_public_page: 'true'
    - script@1:
        is_always_run: true
        title: Capture artifact URLs
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            # BITRISE_PUBLIC_INSTALL_PAGE_URL is set by deploy-to-bitrise-io
            envman add --key INSTALL_PAGE_URL --value "${BITRISE_PUBLIC_INSTALL_PAGE_URL:-}"
  web-staging:
    description: Build the browser extension (Web) Staging zip
    envs:
    - ENVIRONMENT: staging
    - APP_ENV: staging
    - DISABLE_SCREEN_CAPTURE_PREVENTION: 'true'
    - VALIDATE_PROFILE: web
    - ROW_ID: WEB_STAGING
    after_run:
    - _web-build
    - _publish-result
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
  web-production:
    description: Build the browser extension (Web) Production zip
    envs:
    - ENVIRONMENT: production
    - APP_ENV: production
    - VALIDATE_PROFILE: web
    - ROW_ID: WEB_PRODUCTION
    after_run:
    - _web-build
    - _publish-result
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
  _web-build:
    steps:
    - git-clone@8: {}
    - script@1:
        title: Validate environment
        inputs:
        - content: |
            #!/usr/bin/env bash
            ./tools/validate-env.sh
    - restore-cache@3:
        inputs:
        - key: node-modules-{{ checksum "pnpm-lock.yaml" }}
    # `.tool-versions` is asdf-format (`nodejs 22`), which the nvm step's
    # node_version_file does not parse — it silently fell through to the
    # stack default (Node 26) while GitHub Actions' setup-node read the same
    # file correctly and used Node 22. Node >=24 ships an inert Web Storage
    # `globalThis.localStorage`, which makes vitest's jsdom environment skip
    # copying jsdom's own, so `window.localStorage` came back undefined only
    # here. Resolve the pin explicitly and hand nvm an exact version.
    - script@1:
        title: Resolve pinned Node version
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -euo pipefail
            NODE_VERSION=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)
            if [ -z "$NODE_VERSION" ]; then
              echo "No 'nodejs' pin found in .tool-versions"
              exit 1
            fi
            envman add --key NODE_VERSION --value "$NODE_VERSION"
    - nvm@1:
        inputs:
        - node_version: "$NODE_VERSION"
    - script@1:
        title: Install pnpm
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            # Fail loudly if nvm handed us a different major than the repo
            # pins. A silent drift here changes host globals under the test
            # suite (see the Node version note above) and is otherwise only
            # visible as an unrelated-looking test failure.
            ACTIVE_NODE_MAJOR=$(node -p "process.versions.node.split('.')[0]")
            if [ "$ACTIVE_NODE_MAJOR" != "$NODE_VERSION" ]; then
              echo "Node ${ACTIVE_NODE_MAJOR} is active but .tool-versions pins ${NODE_VERSION}"
              exit 1
            fi
            # Pin to the repo's packageManager version — an unpinned
            # `npm i -g pnpm` floats to latest and a pnpm major release
            # would change lockfile/hoisting behavior under the release
            # builds without any repo change. split('+') strips a Corepack
            # hash suffix (e.g. pnpm@10.28.1+sha512-…) that npm can't install.
            PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")
            npm install -g "pnpm@${PNPM_VERSION}"
    - script@1:
        title: Install dependencies
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            pnpm install --frozen-lockfile --prefer-offline
    - save-cache@1:
        inputs:
        - key: node-modules-{{ checksum "pnpm-lock.yaml" }}
        - paths: |-
            node_modules
            apps/mobile/node_modules
            packages/*/node_modules
    - script@1:
        title: Setup Env Secrets
        inputs:
        - content: |
            #!/usr/bin/env bash
            ./tools/setup-env-secrets.sh
    - script@1:
        title: Generate Config
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            # APP_ENV must be set here so generate-config.sh bakes
            # appEnvironment into the bundled config (defaults to development).
            export APP_ENV="${ENVIRONMENT:-development}"
            pnpm run generate:config
    - script@1:
        title: Build packages
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            # Unlike the mobile build (which only needs `packages/*`), the
            # browser extension also depends on workspace packages under
            # `extensions/*` (platform-chrome, keystore-chrome, ledger-web-*).
            # `--filter=...browser` walks the real dependency graph instead
            # of a path glob, so it picks up both. `browser` is the package
            # name in apps/browser/package.json — not the directory.
            export APP_ENV="${ENVIRONMENT:-development}"
            pnpm exec turbo run build --filter=...browser
    - script@1:
        title: Bundle extension (Web)
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            pnpm --filter browser bundle
    - script@1:
        title: Zip extension bundle
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            sudo apt-get update -y
            sudo apt-get install -y zip
            SHA="$(printf '%s' "${BITRISE_GIT_COMMIT:-$GIT_CLONE_COMMIT_HASH}" | cut -c1-7)"
            # ENVIRONMENT is in the name because `_web-build` is shared by
            # web-staging and web-production: same commit, same tag, same
            # SHA, so both jobs used to emit a byte-identically *named* zip.
            # Once downloaded they were indistinguishable, and a staging zip
            # installed by mistake looks exactly like a broken production
            # build (staging backend, no API key, no Remote Config).
            NAME="pera-extension-web-${ENVIRONMENT:-unknown}-${BITRISE_GIT_TAG:-b$BITRISE_BUILD_NUMBER}-${SHA:-b$BITRISE_BUILD_NUMBER}.zip"
            DEST="${BITRISE_DEPLOY_DIR}/${NAME}"
            (cd apps/browser/dist && zip -r "$DEST" .)
            envman add --key BITRISE_EXTENSION_ZIP_PATH --value "$DEST"
    - deploy-to-bitrise-io@2:
        is_always_run: true
        inputs:
        - notify_user_groups: none
        - is_enable_public_page: 'true'
    - script@1:
        is_always_run: true
        title: Capture artifact URLs
        inputs:
        - content: |
            #!/usr/bin/env bash
            # set -e without -x: keep temporary S3 download signatures out of the trace log.
            set -e
            INSTALL_URL="${BITRISE_PUBLIC_INSTALL_PAGE_URL:-}"
            if [ -z "$INSTALL_URL" ] && [ -n "${BITRISE_PERMANENT_DOWNLOAD_URL_MAP:-}" ]; then
              IFS='|' read -ra ADDR <<< "$BITRISE_PERMANENT_DOWNLOAD_URL_MAP"
              for i in "${ADDR[@]}"; do
                if [[ "$i" =~ pera-extension-web-.*\.zip=\>(.+) ]]; then
                  INSTALL_URL="${BASH_REMATCH[1]}"
                  break
                fi
              done
            fi
            envman add --key INSTALL_PAGE_URL --value "$INSTALL_URL"
  _smoke-ios:
    steps:
    - script@1:
        title: Patch IPA for BrowserStack
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -exo pipefail
            # Must happen on the macOS stack — the patch re-signs, so it can't
            # move to the workflow that uploads. The script prints progress on
            # stderr and only the output path on stdout, so this captures the
            # path directly; pipefail is what makes a codesign failure fail the
            # step rather than assigning its last stdout line to SMOKE_ARTIFACT.
            PATCHED="$(./tools/patch-ipa-for-browserstack.sh "$BITRISE_IPA_PATH")"
            envman add --key SMOKE_ARTIFACT --value "$PATCHED"
    - script@1:
        title: Run smoke gate
        # ~11 min covers upload + pip + the run at their worst. The margin above
        # that absorbs a short BrowserStack queue; beyond it we are almost
        # certainly stuck behind the Mon/Wed/Fri regression, which holds its
        # session for hours. BrowserStack has no priority queue, so bound the
        # wait: a release should fail fast and legibly rather than idle a
        # g2.mac.large until someone notices.
        timeout: 1800
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -eo pipefail
            ./tools/smoke-test.sh ios "$SMOKE_ARTIFACT"
    - deploy-to-bitrise-io@2:
        is_always_run: true
        inputs:
        - notify_user_groups: none
        - is_enable_public_page: 'false'
        - deploy_path: "$BITRISE_SOURCE_DIR/smoke-results"
    - script@1:
        is_always_run: true
        title: Publish smoke result
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -e
            # Its own row, not $ROW_ID: the gate now runs inside the staging
            # workflow, whose ROW_ID is IOS_STAGING/ANDROID_STAGING. Reusing
            # that would overwrite a green build row with the gate's verdict
            # and lose which of the two actually broke.
            #
            # The verdict file rather than BITRISE_BUILD_STATUS: that status is
            # workflow-wide, so an artifact-deploy failure would be reported as
            # a failing smoke test. A missing file reads as fail, so a script
            # that died before writing one cannot publish a green.
            STATUS=fail
            if [ -f "$BITRISE_SOURCE_DIR/smoke-results/verdict" ]; then
              STATUS=$(cat "$BITRISE_SOURCE_DIR/smoke-results/verdict")
            fi
            envman add --key "IOS_SMOKE_STATUS" --value "$STATUS"
            envman add --key "IOS_SMOKE_URL" --value "${BITRISE_BUILD_URL:-}"
    - share-pipeline-variable@1:
        is_always_run: true
        inputs:
        - variables: |-
            IOS_SMOKE_STATUS
            IOS_SMOKE_URL
