  _publish-result:
    steps:
    - script@1:
        is_always_run: true
        title: Publish build result
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -e
            if [ "$BITRISE_BUILD_STATUS" = "0" ]; then STATUS=ok; else STATUS=fail; fi
            envman add --key "${ROW_ID}_STATUS" --value "$STATUS"
            envman add --key "${ROW_ID}_URL" --value "${BITRISE_BUILD_URL:-}"
            envman add --key "${ROW_ID}_INSTALL" --value "${INSTALL_PAGE_URL:-}"
    - share-pipeline-variable@1:
        is_always_run: true
        inputs:
        - variables: |-
            ${ROW_ID}_STATUS
            ${ROW_ID}_URL
            ${ROW_ID}_INSTALL
  notify-release-web:
    description: Post one consolidated Web (browser extension) release card (all
      build statuses + changelog) — mirrors notify-release's structure/format for
      the RN builds, kept as a separate card since web-release-builds is a
      separate, manually-triggered pipeline.
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: g2.linux.medium
    steps:
    - script@1:
        is_always_run: true
        title: Send Web Release Slack Notification
        inputs:
        - content: |
            #!/usr/bin/env bash
            # set -e without -x: keep the Slack webhook URL out of the trace log.
            set -e

            # Channel label and tag/branch from tag shape or fallback.
            if [ -n "${BITRISE_GIT_TAG:-}" ]; then
              TAG_OR_BRANCH="$BITRISE_GIT_TAG"
              case "$BITRISE_GIT_TAG" in
                *-alpha.*) CHANNEL="Nightly" ;;
                *-rc.*)    CHANNEL="RC" ;;
                v*)        CHANNEL="Release" ;;
                *)         CHANNEL="Release" ;;
              esac
            else
              TAG_OR_BRANCH="${BITRISE_GIT_BRANCH:-manual}"
              CHANNEL="Manual"
            fi

            # One mrkdwn row per build. Platform/env/destination are static;
            # status + links come from each build's shared pipeline variables
            # (empty status = the build never ran). Literal \n separates rows.
            row() { # $1 status  $2 build_url  $3 install_url  $4 artifact_label  $5 label  $6 dest
              local e
              # An empty status means the build never ran, which on these
              # pipelines only happens when an upstream workflow (`test`,
              # `generate-changelog`) already failed. That is a failed
              # release, so it reads as ❌ on the build's own row rather
              # than as a neutral skip next to a separate Tests row.
              case "$1" in
                ok) e="✅" ;;
                *)  e="❌" ;;
              esac
              local r="${e}  *${5}*  →  ${6}"
              if [ -n "$2" ]; then r="${r}  ·  <${2}|Build>"; fi
              if [ -n "$3" ] && [ -n "$4" ]; then r="${r}  ·  <${3}|${4}>"; fi
              printf '%s' "$r"
            }

            ROWS="$(row "${WEB_PRODUCTION_STATUS:-}" "${WEB_PRODUCTION_URL:-}" "${WEB_PRODUCTION_INSTALL:-}" "Zip" "Web production" "Bitrise artifact")"
            ROWS="${ROWS}\n$(row "${WEB_STAGING_STATUS:-}" "${WEB_STAGING_URL:-}" "${WEB_STAGING_INSTALL:-}" "Zip" "Web staging" "Bitrise artifact")"

            # Header icon per channel on success (any failed build flips it
            # to ❌ + red below): 🚀 stable Release, ⭐ RC, 🌙 Nightly, 📦 Manual.
            case "$CHANNEL" in
              Release) OVERALL="🚀" ;;
              RC)      OVERALL="⭐" ;;
              Nightly) OVERALL="🌙" ;;
              *)       OVERALL="📦" ;;
            esac
            COLOR="#36a64f"
            # Anything that is not an explicit `ok` turns the card red.
            # Matching only on `fail` used to let a failed `test` through as
            # green, because gated builds publish no status at all and the
            # empty string fell into the benign "skipped" bucket. TEST_STATUS
            # is checked here deliberately even though tests get no row of
            # their own — the header/colour is the only signal that the skips
            # below were caused by a red test run rather than by nothing.
            for s in "${TEST_STATUS:-}" "${WEB_STAGING_STATUS:-}" "${WEB_PRODUCTION_STATUS:-}"; do
              if [ "$s" != "ok" ]; then OVERALL="❌"; COLOR="#ec0000"; fi
            done

            # -sS --fail-with-body: without it curl exits 0 on an HTTP 4xx/5xx
            # and the release card silently never arrives. --retry covers
            # transient Slack hiccups (retries only transient failures).
            curl -sS --fail-with-body --retry 2 --max-time 30 -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d @- << EOF
            {
              "username": "Bitrise",
              "icon_emoji": ":bitrise:",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${OVERALL} Web ${CHANNEL} ${TAG_OR_BRANCH}",
                    "emoji": true
                  }
                }
              ],
              "attachments": [
                {
                  "color": "${COLOR}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "${ROWS}"
                      }
                    },
                    {
                      "type": "divider"
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*Changes since last build:*\n${CHANGELOG}"
                      }
                    }
                  ]
                }
              ]
            }
            EOF
  notify-nightly:
    description: Post the nightly card — staging builds plus both smoke gates
    envs:
    - CARD_ROWS: staging
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: g2.linux.medium
    after_run:
    - _notify-card
  notify-release:
    description: Post the rc/release card — production builds only
    envs:
    - CARD_ROWS: production
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: g2.linux.medium
    after_run:
    - _notify-card
  _notify-card:
    description: Post one consolidated release card (all build statuses + changelog).
      Shared by notify-nightly and notify-release, which differ only in CARD_ROWS —
      the two pipelines build different things, so a card listing rows that never
      ran would read as a failed release.
    steps:
    - script@1:
        is_always_run: true
        title: Send Release Slack Notification
        inputs:
        - content: |
            #!/usr/bin/env bash
            # set -e without -x: keep the Slack webhook URL out of the trace log.
            set -e

            # Channel label and tag/branch from tag shape or fallback.
            if [ -n "${BITRISE_GIT_TAG:-}" ]; then
              TAG_OR_BRANCH="$BITRISE_GIT_TAG"
              case "$BITRISE_GIT_TAG" in
                *-alpha.*) CHANNEL="Nightly" ;;
                *-rc.*)    CHANNEL="RC" ;;
                v*)        CHANNEL="Release" ;;
                *)         CHANNEL="Release" ;;
              esac
            else
              TAG_OR_BRANCH="${BITRISE_GIT_BRANCH:-manual}"
              CHANNEL="Manual"
            fi

            # One mrkdwn row per build. Platform/env/destination are static;
            # status + links come from each build's shared pipeline variables
            # (empty status = the build never ran). Literal \n separates rows.
            row() { # $1 status  $2 build_url  $3 install_url  $4 artifact_label  $5 label  $6 dest
              local e
              # An empty status means the build never ran, which on these
              # pipelines only happens when an upstream workflow (`test`,
              # `generate-changelog`) already failed. That is a failed
              # release, so it reads as ❌ on the build's own row rather
              # than as a neutral skip next to a separate Tests row.
              case "$1" in
                ok) e="✅" ;;
                *)  e="❌" ;;
              esac
              local r="${e}  *${5}*  →  ${6}"
              if [ -n "$2" ]; then r="${r}  ·  <${2}|Build>"; fi
              if [ -n "$3" ] && [ -n "$4" ]; then r="${r}  ·  <${3}|${4}>"; fi
              printf '%s' "$r"
            }

            # Rows follow the pipeline: nightly-builds only builds staging and
            # only it runs the smoke gates, release-builds only builds
            # production. Listing a row the pipeline never ran would show an
            # empty status, which reads below as a failed build.
            if [ "${CARD_ROWS:-production}" = "staging" ]; then
              ROWS="$(row "${ANDROID_STAGING_STATUS:-}" "${ANDROID_STAGING_URL:-}" "${ANDROID_STAGING_INSTALL:-}" "APK" "Android staging" "Firebase")"
              ROWS="${ROWS}\n$(row "${IOS_STAGING_STATUS:-}" "${IOS_STAGING_URL:-}" "${IOS_STAGING_INSTALL:-}" "IPA" "iOS staging" "TestFlight")"
              # No install link: smoke binaries have screen-capture prevention
              # disabled and are deliberately not published anywhere.
              ROWS="${ROWS}\n$(row "${IOS_SMOKE_STATUS:-}" "${IOS_SMOKE_URL:-}" "" "" "iOS smoke gate" "BrowserStack")"
              ROWS="${ROWS}\n$(row "${ANDROID_SMOKE_STATUS:-}" "${ANDROID_SMOKE_URL:-}" "" "" "Android smoke gate" "BrowserStack")"
              # An array, not a string: an empty status must survive as its own
              # element. Word-splitting a plain string would drop it, and an
              # empty status is exactly the "never ran" case that must go red.
              CHECKS=("${TEST_STATUS:-}" "${IOS_STAGING_STATUS:-}" "${ANDROID_STAGING_STATUS:-}" "${IOS_SMOKE_STATUS:-}" "${ANDROID_SMOKE_STATUS:-}")
            else
              ROWS="$(row "${ANDROID_PRODUCTION_STATUS:-}" "${ANDROID_PRODUCTION_URL:-}" "${ANDROID_PRODUCTION_INSTALL:-}" "APK" "Android production" "Play internal")"
              ROWS="${ROWS}\n$(row "${IOS_PRODUCTION_STATUS:-}" "${IOS_PRODUCTION_URL:-}" "${IOS_PRODUCTION_INSTALL:-}" "IPA" "iOS production" "TestFlight")"
              CHECKS=("${TEST_STATUS:-}" "${IOS_PRODUCTION_STATUS:-}" "${ANDROID_PRODUCTION_STATUS:-}")
            fi

            # Header icon per channel on success (any failed build flips it
            # to ❌ + red below): 🚀 stable Release, ⭐ RC, 🌙 Nightly, 📦 Manual.
            case "$CHANNEL" in
              Release) OVERALL="🚀" ;;
              RC)      OVERALL="⭐" ;;
              Nightly) OVERALL="🌙" ;;
              *)       OVERALL="📦" ;;
            esac
            COLOR="#36a64f"
            # Anything that is not an explicit `ok` turns the card red.
            # Matching only on `fail` used to let a failed `test` through as
            # green, because gated builds publish no status at all and the
            # empty string fell into the benign "skipped" bucket. TEST_STATUS
            # is checked here deliberately even though tests get no row of
            # their own — the header/colour is the only signal that the skips
            # below were caused by a red test run rather than by nothing. The
            # smoke gates run inside the staging workflows and always publish
            # a status, so an empty one likewise means the build never got
            # there rather than that the gate was skipped.
            #
            # CHECKS is scoped to this pipeline's own rows, set above.
            for s in "${CHECKS[@]}"; do
              if [ "$s" != "ok" ]; then OVERALL="❌"; COLOR="#ec0000"; fi
            done

            # The card only ever shows a summary — capped at 7 entries a
            # section and again at 2500 characters, because Slack drops the
            # whole payload past 3000. The uploaded artifact is the unabridged
            # copy. Literal \n: the payload below is JSON, not shell.
            NOTES_LINK=""
            if [ -n "${CHANGELOG_URL:-}" ]; then
              NOTES_LINK="\n\n<${CHANGELOG_URL}|Full changelog>"
            fi
            # Only stable tags get a GitHub release — publish-github-release.sh
            # is stable-only by design — so linking one unconditionally sent
            # every nightly and rc card to a 404.
            case "${BITRISE_GIT_TAG:-}" in
              *-alpha.* | *-rc.*) ;;
              v[0-9]*)
                NOTES_LINK="${NOTES_LINK}\n<https://github.com/perawallet/pera-react-native/releases/tag/${BITRISE_GIT_TAG}|Release notes>"
                ;;
            esac

            # -sS --fail-with-body: without it curl exits 0 on an HTTP 4xx/5xx
            # and the release card silently never arrives. --retry covers
            # transient Slack hiccups (retries only transient failures).
            curl -sS --fail-with-body --retry 2 --max-time 30 -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d @- << EOF
            {
              "username": "Bitrise",
              "icon_emoji": ":bitrise:",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${OVERALL} RN ${CHANNEL} ${TAG_OR_BRANCH}",
                    "emoji": true
                  }
                }
              ],
              "attachments": [
                {
                  "color": "${COLOR}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "${ROWS}"
                      }
                    },
                    {
                      "type": "divider"
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*Changes since last build:*\n${CHANGELOG}${NOTES_LINK}"
                      }
                    }
                  ]
                }
              ]
            }
            EOF
meta:
  bitrise.io:
    stack: ubuntu-noble-24.04-bitrise-2025-android
    machine_type_id: g2.linux.large
