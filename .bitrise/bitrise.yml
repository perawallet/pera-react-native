---
format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: react-native
app:
  envs:
    - BITRISE_PROJECT_PATH: apps/mobile/ios/pera.xcworkspace
    - BITRISE_SCHEME_STAGING: Pera7Staging
    - BITRISE_SCHEME_PRODUCTION: Pera7Production
    - BITRISE_EXPORT_METHOD_STAGING: app-store
    - BITRISE_EXPORT_METHOD_PRODUCTION: app-store
    - ANDROID_MODULE: app
    - ANDROID_BUILD_TYPE: Release
    - GRADLE_BUILD_FILE_PATH: apps/mobile/android/build.gradle
    - JIRA_BASE_URL: https://algorandfoundation.atlassian.net
pipelines:
  qa-builds:
    stages:
      - create-nightly-tag-stage:
          abort_on_fail: true
  release-builds:
    stages:
      - test-stage: {}
      - release-build-stage:
          abort_on_fail: true
    triggers:
      tag:
        - name:
            regex: v.*
stages:
  create-nightly-tag-stage:
    workflows:
      - create-nightly-tag: {}
  test-stage:
    workflows:
      - test: {}
  release-build-stage:
    workflows:
      - ios-production: {}
      - android-production: {}
      - ios-staging: {}
      - android-staging: {}
workflows:
  create-nightly-tag:
    description: Mint a vX.Y.Z-nightly.A tag on main HEAD to trigger release-builds
    envs:
      - VALIDATE_PROFILE: create-nightly-tag
    meta:
      bitrise.io:
        stack: linux-docker-android-22.04
    steps:
      - git-clone@8:
          inputs:
            - fetch_tags: "yes"
            - clone_depth: -1
      - script@1:
          title: Validate environment
          inputs:
            - content: |
                #!/usr/bin/env bash
                ./tools/validate-env.sh
      - script@1:
          title: Create nightly tag
          inputs:
            - content: |
                #!/usr/bin/env bash
                ./tools/create-nightly-tag.sh
  test:
    description: Run tests before release
    meta:
      bitrise.io:
        stack: linux-docker-android-22.04
    envs:
      - ENVIRONMENT: production
      - VALIDATE_PROFILE: test
    steps:
      - git-clone@8: {}
      - script@1:
          title: Validate environment
          inputs:
            - content: |
                #!/usr/bin/env bash
                ./tools/validate-env.sh
      - restore-cache@2:
          inputs:
            - key: node-modules-{{ checksum "pnpm-lock.yaml" }}
      - nvm@1:
          inputs:
            - node_version_file: ".tool-versions"
      - script@1:
          title: Install pnpm
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                npm install -g pnpm
      - script@1:
          title: Install dependencies
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                pnpm install --frozen-lockfile --prefer-offline
      - save-cache@1:
          inputs:
            - key: node-modules-{{ checksum "pnpm-lock.yaml" }}
            - paths: |-
                node_modules
                apps/mobile/node_modules
                packages/*/node_modules
      - script@1:
          title: Generate Config
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                # APP_ENV must be set here so generate-config.sh bakes
                # appEnvironment into the bundled config (defaults to development).
                export APP_ENV="${ENVIRONMENT:-development}"
                pnpm run generate:config
      - script@1:
          title: Run Tests
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                pnpm run test
  ios-staging:
    description: Build and deploy iOS Staging to TestFlight
    envs:
      - ENVIRONMENT: staging
      - APP_ENV: staging
      - DISABLE_SCREEN_CAPTURE_PREVENTION: "true"
      - BITRISE_SCHEME: "$BITRISE_SCHEME_STAGING"
      - NOTIFICATION_TITLE_PREFIX: QA Build (Nightly)
      - USE_CACHE: "true"
      - PARENT_WORKFLOW: qa-build
      - VALIDATE_PROFILE: ios
    steps:
      - script@1:
          title: Check pipeline outputs
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                # In Bitrise pipelines, outputs from previous stages are available via env vars
                if [ "${HAS_CHANGES:-true}" == "false" ]; then
                  echo "No changes detected in previous stage, skipping build"
                  envman add --key SKIP_BUILD --value "true"
                else
                  envman add --key SKIP_BUILD --value "false"
                fi
    after_run:
      - _ios-build
      - _slack-notify-ios
    meta:
      bitrise.io:
        stack: osx-xcode-26.2.x-edge
        machine_type_id: g2.mac.large
  ios-production:
    description: Build and deploy iOS Production to TestFlight
    envs:
      - ENVIRONMENT: production
      - APP_ENV: production
      - BITRISE_SCHEME: "$BITRISE_SCHEME_PRODUCTION"
      - IOS_PROFILE_NAME: Pera React Native Prod
      - NOTIFICATION_TITLE_PREFIX: Release Candidate
      - USE_CACHE: "false"
      - PARENT_WORKFLOW: release
      - SKIP_BUILD: "false"
      - VALIDATE_PROFILE: ios
    after_run:
      - _ios-build
      - _slack-notify-ios
    meta:
      bitrise.io:
        stack: osx-xcode-26.2.x-edge
        machine_type_id: g2.mac.large
  _ios-build:
    steps:
      - git-clone@8:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          inputs:
            - fetch_tags: "yes"
            - clone_depth: 0
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Validate environment
          inputs:
            - content: |
                #!/usr/bin/env bash
                ./tools/validate-env.sh
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Generate Changelog (if not from pipeline)
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex

                # Skip if CHANGELOG was already set by a prior stage
                if [ -n "$CHANGELOG" ]; then
                  echo "Changelog already set from pipeline, skipping generation"
                  exit 0
                fi

                echo "Generating changelog (not available from pipeline)"

                # For production builds, generate changelog from the last tag
                LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
                if [ -n "$LAST_TAG" ]; then
                  echo "Generating changelog since tag: $LAST_TAG"
                  CHANGELOG=$(./tools/generate_changelog.sh "$LAST_TAG")
                else
                  echo "No previous tag found"
                  CHANGELOG="Release build - see git history for changes"
                fi

                envman add --key CHANGELOG --value "$CHANGELOG"
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Install Ruby via asdf
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                asdf plugin add ruby || true
                asdf install ruby
      - restore-cache@2:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          inputs:
            - key: bundler-{{ checksum "apps/mobile/Gemfile.lock" }}
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Install Bundler gems
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                cd apps/mobile
                bundle install
      - save-cache@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          inputs:
            - key: bundler-{{ checksum "apps/mobile/Gemfile.lock" }}
            - paths: apps/mobile/vendor/bundle
      - restore-cache@2:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          inputs:
            - key: node-modules-ios-{{ checksum "pnpm-lock.yaml" }}
      - nvm@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          inputs:
            - node_version_file: ".tool-versions"
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Install pnpm
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                npm install -g pnpm
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Install dependencies
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                pnpm install --frozen-lockfile --prefer-offline
      - save-cache@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          inputs:
            - key: node-modules-{{ checksum "pnpm-lock.yaml" }}
            - paths: |-
                node_modules
                apps/mobile/node_modules
                packages/*/node_modules
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Setup Env Secrets
          inputs:
            - content: |
                #!/usr/bin/env bash
                ./tools/setup-env-secrets.sh
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Generate Config
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                # APP_ENV must be set here so generate-config.sh bakes
                # appEnvironment into the bundled config (defaults to development).
                export APP_ENV="${ENVIRONMENT:-development}"
                pnpm run generate:config
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Build packages
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                # build:packages re-runs generate-config.sh, which bakes
                # appEnvironment from APP_ENV. Derive it from ENVIRONMENT here
                # (step shells don't inherit prior steps' exports) or the
                # bundled appEnvironment silently falls back to development.
                export APP_ENV="${ENVIRONMENT:-development}"
                pnpm run build:packages
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Inject Google Service Info
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                echo "$IOS_GOOGLE_SERVICE_INFO_BASE64" | base64 --decode > apps/mobile/config/GoogleService-Info.plist
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Expo Prebuild
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                export APP_ENV=$ENVIRONMENT
                pnpm --filter mobile expo:prebuild
      - restore-cache@2:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          inputs:
            - key: ios-pods-{{ checksum "apps/mobile/ios/Podfile.lock" }}
            - keys: ios-pods-
      - save-cache@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          inputs:
            - key: ios-pods-{{ checksum "apps/mobile/ios/Podfile.lock" }}
            - paths: apps/mobile/ios/Pods
      - restore-cache@2:
          run_if: '{{and (enveq "SKIP_BUILD" "false") (enveq "USE_CACHE" "true")}}'
          inputs:
            - key:
                ios-derived-data-$BITRISE_SCHEME-{{ checksum "apps/mobile/ios/Podfile.lock"
                }}-{{ checksum "pnpm-lock.yaml" }}
            - keys: |-
                ios-derived-data-$BITRISE_SCHEME-
                ios-derived-data-
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Get version from package.json
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                VERSION=$(jq -r '.version | split("-")[0]' apps/mobile/package.json)
                envman add --key APP_VERSION --value "$VERSION"
                envman add --key BUILD_NUMBER --value "$BITRISE_BUILD_NUMBER"
      - certificate-and-profile-installer@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Build & Deploy iOS
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                cd apps/mobile

                # Write API key to file
                echo "$APP_STORE_CONNECT_API_KEY_CONTENT" > api_key.p8
                export APP_STORE_CONNECT_API_KEY_CONTENT=$(cat api_key.p8)

                # Determine if we should clean
                CLEAN="true"
                if [ "$USE_CACHE" == "true" ]; then
                  CLEAN="false"
                fi

                bundle exec fastlane ios deploy_testflight scheme:$BITRISE_SCHEME clean:$CLEAN
      - save-cache@1:
          run_if: '{{and (enveq "SKIP_BUILD" "false") (enveq "USE_CACHE" "true")}}'
          inputs:
            - key:
                ios-derived-data-$BITRISE_SCHEME-{{ checksum "apps/mobile/ios/Podfile.lock"
                }}-{{ checksum "pnpm-lock.yaml" }}
            - paths: "~/Library/Developer/Xcode/DerivedData"
      - deploy-to-bitrise-io@2:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          inputs:
            - notify_user_groups: none
            - is_enable_public_page: "true"
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Capture artifact URLs
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                # BITRISE_PUBLIC_INSTALL_PAGE_URL is set by deploy-to-bitrise-io
                envman add --key INSTALL_PAGE_URL --value "${BITRISE_PUBLIC_INSTALL_PAGE_URL:-}"
  android-staging:
    description: Build and deploy Android Staging to Firebase App Distribution
    envs:
      - ENVIRONMENT: staging
      - APP_ENV: staging
      - DISABLE_SCREEN_CAPTURE_PREVENTION: "true"
      - ANDROID_FLAVOR: staging
      - ANDROID_PACKAGE_NAME: com.algorand.perarn.staging
      - NOTIFICATION_TITLE_PREFIX: QA Build (Nightly)
      - USE_CACHE: "true"
      - PARENT_WORKFLOW: qa-build
      - DISTRIBUTION: firebase
      - VALIDATE_PROFILE: android
    steps:
      - script@1:
          title: Check pipeline outputs
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                # In Bitrise pipelines, outputs from previous stages are available via env vars
                if [ "${HAS_CHANGES:-true}" == "false" ]; then
                  echo "No changes detected in previous stage, skipping build"
                  envman add --key SKIP_BUILD --value "true"
                else
                  envman add --key SKIP_BUILD --value "false"
                fi
    after_run:
      - _android-build
      - _slack-notify-android
    meta:
      bitrise.io:
        stack: linux-docker-android-22.04
  android-staging-test:
    description: Android Staging with LEGACY ids (installs over legacy app) → Firebase
    envs:
      - ENVIRONMENT: staging
      - APP_ENV: staging
      - ANDROID_FLAVOR: staging
      - ANDROID_APPLICATION_ID: com.algorand.android.staging
      - BUILD_NUMBER_OFFSET: "6000"
      - FIREBASE_TESTER_GROUPS: pera
      - NOTIFICATION_TITLE_PREFIX: QA Build (Migration Test)
      - USE_CACHE: "true"
      - PARENT_WORKFLOW: qa-build
      - DISTRIBUTION: firebase
      - SKIP_BUILD: "false"
      - VALIDATE_PROFILE: android
    after_run:
      - _android-build
      - _slack-notify-android
    meta:
      bitrise.io:
        stack: linux-docker-android-22.04
  android-production:
    description: Build and deploy Android Production to Play Store Internal
    envs:
      - ENVIRONMENT: production
      - APP_ENV: production
      - ANDROID_FLAVOR: production
      - ANDROID_PACKAGE_NAME: com.algorand.perarn
      - NOTIFICATION_TITLE_PREFIX: Release Candidate
      - USE_CACHE: "false"
      - PARENT_WORKFLOW: release
      - DISTRIBUTION: firebase
      - SKIP_BUILD: "false"
      - VALIDATE_PROFILE: android
    after_run:
      - _android-build
      - _slack-notify-android
    meta:
      bitrise.io:
        stack: linux-docker-android-22.04
  _android-build:
    steps:
      - git-clone@8:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          inputs:
            - fetch_tags: "yes"
            - clone_depth: 0
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Validate environment
          inputs:
            - content: |
                #!/usr/bin/env bash
                ./tools/validate-env.sh
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Generate Changelog (if not from pipeline)
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex

                # Skip if CHANGELOG was already set by a prior stage
                if [ -n "$CHANGELOG" ]; then
                  echo "Changelog already set from pipeline, skipping generation"
                  exit 0
                fi

                echo "Generating changelog (not available from pipeline)"

                # For production builds, generate changelog from the last tag
                LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
                if [ -n "$LAST_TAG" ]; then
                  echo "Generating changelog since tag: $LAST_TAG"
                  CHANGELOG=$(./tools/generate_changelog.sh "$LAST_TAG")
                else
                  echo "No previous tag found"
                  CHANGELOG="Release build - see git history for changes"
                fi

                envman add --key CHANGELOG --value "$CHANGELOG"
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Install Ruby via asdf
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                asdf plugin add ruby || true
                asdf install ruby
      - restore-cache@2:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          inputs:
            - key: bundler-{{ checksum "apps/mobile/Gemfile.lock" }}
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Install Bundler gems
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                cd apps/mobile
                bundle install
      - save-cache@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          inputs:
            - key: bundler-{{ checksum "apps/mobile/Gemfile.lock" }}
            - paths: apps/mobile/vendor/bundle
      - restore-cache@2:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          inputs:
            - key: node-modules-{{ checksum "pnpm-lock.yaml" }}
      - nvm@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          inputs:
            - node_version_file: ".tool-versions"
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Install pnpm
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                npm install -g pnpm
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Install dependencies
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                pnpm install --frozen-lockfile --prefer-offline
      - save-cache@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          inputs:
            - key: node-modules-{{ checksum "pnpm-lock.yaml" }}
            - paths: |-
                node_modules
                apps/mobile/node_modules
                packages/*/node_modules
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Setup Env Secrets
          inputs:
            - content: |
                #!/usr/bin/env bash
                ./tools/setup-env-secrets.sh
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Generate Config
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                # APP_ENV must be set here so generate-config.sh bakes
                # appEnvironment into the bundled config (defaults to development).
                export APP_ENV="${ENVIRONMENT:-development}"
                pnpm run generate:config
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Build packages
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                # build:packages re-runs generate-config.sh, which bakes
                # appEnvironment from APP_ENV. Derive it from ENVIRONMENT here
                # (step shells don't inherit prior steps' exports) or the
                # bundled appEnvironment silently falls back to development.
                export APP_ENV="${ENVIRONMENT:-development}"
                pnpm run build:packages
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Inject Google Services JSON
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                echo "$ANDROID_GOOGLE_SERVICES_BASE64" | base64 --decode > apps/mobile/config/google-services.json
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Get version from package.json
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                VERSION=$(jq -r '.version | split("-")[0]' apps/mobile/package.json)
                envman add --key APP_VERSION --value "$VERSION"
                envman add --key BUILD_NUMBER --value "$((BITRISE_BUILD_NUMBER + ${BUILD_NUMBER_OFFSET:-0}))"
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Expo Prebuild
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                export APP_ENV=$ENVIRONMENT
                pnpm --filter mobile expo:prebuild

                # Increase Gradle JVM memory to avoid OOM
                # We use envman to make sure it persists for the Fastlane step
                envman add --key GRADLE_OPTS --value "-Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1g' -Dorg.gradle.daemon=false"
      - restore-cache@2:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          inputs:
            - key: android-gradle-{{ checksum "pnpm-lock.yaml" }}-{{ checksum
                "apps/mobile/android/build.gradle" }}
            - keys: android-gradle-
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Install and configure ccache
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                sudo apt-get update
                sudo apt-get install -y ccache
                mkdir -p $HOME/.ccache
                ccache --set-config=max_size=2G
                ccache --set-config=compression=true
                echo "NDK_CCACHE=ccache" >> $BITRISE_SOURCE_DIR/.env
                echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $BITRISE_SOURCE_DIR/.env
                echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $BITRISE_SOURCE_DIR/.env
      - restore-cache@2:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          inputs:
            - key: android-ccache-{{ checksum "pnpm-lock.yaml" }}
            - keys: android-ccache-
      - set-java-version@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          inputs:
            - java_version: "17"
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Install Java via asdf
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                asdf plugin add java || true
                asdf install java
                # Set JAVA_HOME for Gradle
                JAVA_HOME=$(asdf where java)
                envman add --key JAVA_HOME --value "$JAVA_HOME"
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Android KeyStore
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/mobile/config/release.keystore
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Setup distribution credentials
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex

                if [ "$DISTRIBUTION" == "firebase" ]; then
                  echo "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > apps/mobile/config/firebase-service-account.json
                else
                  echo "$ANDROID_JSON_KEY_FILE" > apps/mobile/config/api-key.json
                fi
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Build & Deploy Android
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                cd apps/mobile

                # Set release notes from changelog
                export RELEASE_NOTES="$CHANGELOG"

                # Determine if we should clean
                CLEAN="true"
                if [ "$USE_CACHE" == "true" ]; then
                  CLEAN="false"
                fi

                if [ "$DISTRIBUTION" == "firebase" ]; then
                  bundle exec fastlane android deploy_firebase flavor:$ANDROID_FLAVOR clean:$CLEAN
                else
                  bundle exec fastlane android deploy_internal flavor:$ANDROID_FLAVOR clean:$CLEAN
                fi
      - save-cache@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          inputs:
            - key: android-gradle-{{ checksum "pnpm-lock.yaml" }}-{{ checksum
                "apps/mobile/android/build.gradle" }}
            - paths: |-
                ~/.gradle/caches
                ~/.gradle/wrapper
      - save-cache@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          inputs:
            - key: android-ccache-{{ checksum "pnpm-lock.yaml" }}
            - paths: "~/.ccache"
      - deploy-to-bitrise-io@2:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          inputs:
            - notify_user_groups: none
            - is_enable_public_page: "true"
      - script@1:
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          title: Capture artifact URLs
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                # BITRISE_PUBLIC_INSTALL_PAGE_URL is set by deploy-to-bitrise-io
                envman add --key INSTALL_PAGE_URL --value "${BITRISE_PUBLIC_INSTALL_PAGE_URL:-}"
  _slack-notify-ios:
    steps:
      - script@1:
          title: Send Slack Notification
          run_if: '{{enveq "SKIP_BUILD" "false"}}'
          is_always_run: true
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex

                if [ "$BITRISE_BUILD_STATUS" == "0" ]; then
                  STATUS_EMOJI="✅"
                  STATUS_TEXT="Available on TestFlight"
                  COLOR="#36a64f"
                  STATUS="success"
                else
                  STATUS_EMOJI="❌"
                  STATUS_TEXT="Failed"
                  COLOR="#ec0000"
                  STATUS="failure"
                fi

                # Build context elements with optional install page link
                CONTEXT_ELEMENTS="[{\"type\": \"mrkdwn\", \"text\": \"<${BITRISE_BUILD_URL}|View Build>\"}"
                if [ -n "$INSTALL_PAGE_URL" ]; then
                  CONTEXT_ELEMENTS="${CONTEXT_ELEMENTS}, {\"type\": \"mrkdwn\", \"text\": \"<${INSTALL_PAGE_URL}|Download IPA>\"}"
                fi
                CONTEXT_ELEMENTS="${CONTEXT_ELEMENTS}]"

                curl -X POST "$SLACK_WEBHOOK_URL" \
                  -H "Content-Type: application/json" \
                  -d @- << EOF
                {
                  "username": "Bitrise",
                  "icon_emoji": ":bitrise:",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "${STATUS_EMOJI} RN ${NOTIFICATION_TITLE_PREFIX}: iOS ${ENVIRONMENT} ${STATUS_TEXT}",
                        "emoji": true
                      }
                    }
                  ],
                  "attachments": [
                    {
                      "color": "${COLOR}",
                      "blocks": [
                        {
                          "type": "section",
                          "fields": [
                            {
                              "type": "mrkdwn",
                              "text": "*Platform:*\niOS"
                            },
                            {
                              "type": "mrkdwn",
                              "text": "*Version:*\n${APP_VERSION} (${BUILD_NUMBER})"
                            },
                            {
                              "type": "mrkdwn",
                              "text": "*Status:*\n${STATUS}"
                            }
                          ]
                        },
                        {
                          "type": "divider"
                        },
                        {
                          "type": "section",
                          "text": {
                            "type": "mrkdwn",
                            "text": "*Changes since last build:*"
                          }
                        },
                        {
                          "type": "section",
                          "text": {
                            "type": "mrkdwn",
                            "text": "${CHANGELOG}"
                          }
                        },
                        {
                          "type": "divider"
                        },
                        {
                          "type": "context",
                          "elements": ${CONTEXT_ELEMENTS}
                        }
                      ]
                    }
                  ]
                }
                EOF
  _slack-notify-android:
