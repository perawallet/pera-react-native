version: 2
updates:
  # Workspace npm dependencies. Grouped by risk so one PR per ecosystem tier
  # instead of dozens of noisy single-package PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    # Mirror pnpm's minimumReleaseAge (7d) so Dependabot stops proposing versions
    # our install gate would reject anyway. Keep this exclude list in sync with
    # minimumReleaseAgeExclude in pnpm-workspace.yaml. Security updates bypass
    # cooldown, so advisory fixes still come through immediately.
    cooldown:
      default-days: 7
      include:
        - "*"
      exclude:
        - "@algorandfoundation/keystore"
        - "@algorandfoundation/react-native-keystore"
        - "@algorandfoundation/react-native-passkey-autofill"
        - "expo"
        - "expo-*"
        - "@expo/*"
        - "babel-preset-expo"
    labels:
      - dependencies
    groups:
      types:
        patterns:
          - "@types/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      babel:
        patterns:
          - "@babel/*"
          - babel-*
      expo:
        patterns:
          - expo
          - expo-*
          - "@expo/*"
          - babel-preset-expo
      react-native:
        patterns:
          - react-native
          - react-native-*
          - "@react-native/*"
          - "@react-native-*"
      react-navigation:
        patterns:
          - "@react-navigation/*"
      firebase:
        patterns:
          - "@react-native-firebase/*"
      algorand:
        patterns:
          - "@algorandfoundation/*"
      vite-vitest:
        patterns:
          - vite
          - vite-*
          - vitest
          - "@vitest/*"
          - "@vitejs/*"
      eslint-oxc:
        patterns:
          - eslint
          - eslint-*
          - typescript-eslint
          - oxlint
          - oxlint-*
          - oxfmt
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Majors for framework-tier deps are migrations, not bumps — handled manually.
      # react/react-dom are pinned to react-native 0.86.0's bundled renderer
      # (19.2.3). RN does an exact React.version match at runtime, so even a patch
      # bump (e.g. 19.2.7) red-screens with "Incompatible React versions". Ignore
      # ALL update types — these move only when the RN/Expo SDK moves.
      - dependency-name: react
      - dependency-name: react-dom
      # Patch is in this list because a react-native patch is not a patch as far
      # as native code is concerned. With EXPO_USE_PRECOMPILED_MODULES, Expo's
      # modules ship as prebuilt XCFrameworks compiled against one specific RN,
      # and RN moves Fabric/JSI C++ internals between patch releases. Nothing
      # expresses that coupling — expo declares `react-native: "*"` — so the
      # resolver cannot catch it, and dyld can't either: it rejects *missing*
      # symbols, not *changed struct layouts*, which instead corrupt the heap at
      # runtime. 0.86.0 → 0.86.2 did exactly that (PERA-4830): the app died mid-
      # navigation with a Hermes GC protection fault and a malloc free-list
      # botch. Moves only when the Expo SDK moves.
      - dependency-name: react-native
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: expo
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # WalletConnect is pinned to v1 on purpose — the whole @perawallet/wallet-core-walletconnect
      # package targets the v1 protocol. v2 is a full protocol migration, not a dep bump.
      - dependency-name: "@walletconnect/client"
      - dependency-name: "@walletconnect/types"
      - dependency-name: "@walletconnect/utils"
      # @noble/hashes v2 is ESM-only and requires `.js` suffixes on subpath imports,
      # which is a non-trivial migration for Metro + Vitest. Stay on v1 until we plan it.
      - dependency-name: "@noble/hashes"
        update-types: [version-update:semver-major]
      # @types/node must track the Node runtime pinned in .tool-versions (currently 22).
      # Auto-bumping past the runtime LTS just produces red builds.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # @rneui 5.0.0 migrates Button from TouchableOpacity to Pressable and
      # reworks Avatar; that's a UI migration with visual regression risk, not
      # a bump. Handle as a dedicated PR.
      - dependency-name: "@rneui/base"
        update-types: [version-update:semver-major]
      - dependency-name: "@rneui/themed"
        update-types: [version-update:semver-major]
      # jsdom 29 rewrote CSSOM using a Proxy; array-index set traps return
      # falsish and React DOM 19's setValueForStyle trips strict-mode throws.
      # Stay on 27 until jsdom fixes the regression or React DOM changes.
      - dependency-name: jsdom
        update-types: [version-update:semver-major]
      # Native modules pinned to Expo SDK 57's bundled versions. Expo builds and
      # tests the SDK against exact versions; bumping any of these independently
      # (even a patch) drifts from the SDK and risks native/ABI mismatches. They
      # move only when the Expo SDK moves. reanimated/worklets are a lockstep pair;
      # nitro-modules is also override-pinned to one ABI for all nitro consumers.
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-worklets
      - dependency-name: react-native-nitro-modules
      - dependency-name: react-native-pager-view
      - dependency-name: react-native-keyboard-controller
      # expo-image is the same lockstep case, but it bites at *launch* rather
      # than at build: with EXPO_USE_PRECOMPILED_MODULES its XCFramework is
      # downloaded prebuilt, so it is linked against whatever
      # expo-modules-core existed when Expo published it — never against ours.
      # 57.0.2 was built against the module-lifecycle API (didCreate,
      # didStartListening, didStopListening, willDestroy) that core only gained
      # in 57.0.9, so pairing it with the 57.0.7 core that expo@57.0.8 pins
      # aborts in dyld before any JS runs. Nothing catches this: expo-image
      # declares no dependency on expo-modules-core, and each artifact is
      # fetched per-package. Pinned exactly, and moves only when the SDK does.
      - dependency-name: expo-image

  # Pin GitHub Actions by SHA; Dependabot rewrites the SHA and updates the
  # trailing version comment so reviewers can see the human-readable bump.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # pnpm/action-setup v6 ignores both `version:` input and `packageManager`
      # field, always installing pnpm 11-rc, which corrupts pnpm 10 lockfiles
      # in memory (pnpm/action-setup#225, #227, #228). Stay on v5 until fixed.
      - dependency-name: pnpm/action-setup
        update-types: [version-update:semver-major]
