version: 2
updates:
  # Workspace npm dependencies. Grouped by risk so one PR per ecosystem tier
  # instead of dozens of noisy single-package PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    # Mirror pnpm's minimumReleaseAge (7d) so Dependabot stops proposing versions
    # our install gate would reject anyway. Keep this exclude list in sync with
    # minimumReleaseAgeExclude in pnpm-workspace.yaml. Security updates bypass
    # cooldown, so advisory fixes still come through immediately.
    cooldown:
      default-days: 7
      include:
        - "*"
      exclude:
        - "@algorandfoundation/keystore-core"
        - "@algorandfoundation/keystore-node"
        - "@algorandfoundation/keystore-web"
        - "@algorandfoundation/react-native-keystore"
        - "@algorandfoundation/react-native-passkey-autofill"
        - "expo"
        - "expo-*"
        - "@expo/*"
        - "babel-preset-expo"
    labels:
      - dependencies
    groups:
      types:
        patterns:
          - "@types/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      babel:
        patterns:
          - "@babel/*"
          - babel-*
      expo:
        patterns:
          - expo
          - expo-*
          - "@expo/*"
          - babel-preset-expo
      react-native:
        patterns:
          - react-native
          - react-native-*
          - "@react-native/*"
          - "@react-native-*"
      react-navigation:
        patterns:
          - "@react-navigation/*"
      firebase:
        patterns:
          - "@react-native-firebase/*"
      algorand:
        patterns:
          - "@algorandfoundation/*"
      vite-vitest:
        patterns:
          - vite
          - vite-*
          - vitest
          - "@vitest/*"
          - "@vitejs/*"
      eslint-oxc:
        patterns:
          - eslint
          - eslint-*
          - typescript-eslint
          - oxlint
          - oxlint-*
          - oxfmt
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Majors for framework-tier deps are migrations, not bumps — handled manually.
      # react/react-dom are pinned to react-native 0.86.0's bundled renderer
      # (19.2.3). RN does an exact React.version match at runtime, so even a patch
      # bump (e.g. 19.2.7) red-screens with "Incompatible React versions". Ignore
      # ALL update types — these move only when the RN/Expo SDK moves.
      - dependency-name: react
      - dependency-name: react-dom
      # Patch is in this list because a react-native patch is not a patch as far
      # as native code is concerned. With EXPO_USE_PRECOMPILED_MODULES, Expo's
      # modules ship as prebuilt XCFrameworks compiled against one specific RN,
      # and RN moves Fabric/JSI C++ internals between patch releases. Nothing
      # expresses that coupling — expo declares `react-native: "*"` — so the
      # resolver cannot catch it, and dyld can't either: it rejects *missing*
      # symbols, not *changed struct layouts*, which instead corrupt the heap at
      # runtime.
      #
      # Now aligned at 0.86.2 under Expo SDK 57.0.11 / expo-modules-core 57.0.10.
      # The pin stays because the coupling is structural, not
      # because of any one incident: RN and the Expo SDK move together or not at
      # all. Bump this only as part of an SDK move, with a device launch test.
      - dependency-name: react-native
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      # RN's own packages carry the RN version, they are not independent
      # libraries: babel-preset compiles the app's JS for one runtime and
      # codegen emits native specs against one set of Fabric/JSI interfaces.
      # With react-native pinned above on every update type, letting these
      # drift gives a 0.87 toolchain building against a 0.86.2 runtime. Nothing
      # catches that — none of them declares a dependency on react-native — and
      # the app never loads @react-native/metro-config anyway (metro.config.js
      # uses expo/metro-config), so the only effect is risk.
      - dependency-name: "@react-native/*"
      # Same reasoning as react-native above, and for the same reason it lists
      # patch: an `expo` patch is an SDK move. 57.0.17 bundles
      # expo-modules-core ~57.0.14 against the 57.0.10 this tree is aligned on,
      # so taking it either splits core or drags the whole native
      # set forward. It also floors expo-constants at ~57.0.15, which the
      # 57.0.9 override below contradicts — so pnpm resolves the conflict by
      # keeping expo where it is, and the bump reopens every week having
      # changed nothing. Move expo with the SDK, with a device launch test.
      - dependency-name: expo
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      # Bundled by `expo` itself, through tilde floats rather than a pin
      # (57.0.11 declares expo-asset ~57.0.9, expo-file-system ~57.0.2). A
      # direct spec ahead of what the installed SDK bundles doesn't upgrade the
      # module, it installs a *second* copy of it — the same
      # duplicate-diverging-from-the-prebuilt-pod problem the expo-constants
      # and expo-build-properties overrides exist to prevent. Telling detail:
      # the versions on offer, 57.0.15 and 57.0.6, are exactly the ones expo
      # 57.0.17 bundles. These move when the SDK moves.
      - dependency-name: expo-asset
      - dependency-name: expo-file-system
      # Nothing here runs eslint — there is no eslint config in the repo and
      # every workspace `lint` script is oxlint. `eslint` exists only to satisfy
      # the peer of the two plugins oxlint loads through `jsPlugins`, and
      # eslint-plugin-react-native@5.0.0 (the latest) caps that peer at `^9`.
      # So eslint 10 would buy nothing and cost an unmet peer. Revisit if that
      # plugin ships a release accepting ^10, or if it stops being loaded.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # WalletConnect is pinned to v1 on purpose — the whole @perawallet/wallet-core-walletconnect
      # package targets the v1 protocol. v2 is a full protocol migration, not a dep bump.
      - dependency-name: "@walletconnect/client"
      - dependency-name: "@walletconnect/types"
      - dependency-name: "@walletconnect/utils"
      # @types/node must track the Node runtime pinned in .tool-versions (currently 22).
      # Auto-bumping past the runtime LTS just produces red builds.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # @rneui 5.0.0 migrates Button from TouchableOpacity to Pressable and
      # reworks Avatar; that's a UI migration with visual regression risk, not
      # a bump. Handle as a dedicated PR.
      - dependency-name: "@rneui/base"
        update-types: [version-update:semver-major]
      - dependency-name: "@rneui/themed"
        update-types: [version-update:semver-major]
      # jsdom 29 rewrote CSSOM using a Proxy; array-index set traps return
      # falsish and React DOM 19's setValueForStyle trips strict-mode throws.
      # Stay on 27 until jsdom fixes the regression or React DOM changes.
      - dependency-name: jsdom
        update-types: [version-update:semver-major]
      # Native modules that move as one reviewed set, never individually. Bumping
      # any of these on its own risks a native/ABI mismatch that no resolver and
      # no linker will catch. reanimated/worklets are a lockstep pair;
      # nitro-modules is also override-pinned to one ABI for all nitro consumers.
      #
      # We run these *ahead* of the versions Expo bundles with SDK 57, on purpose
      # and for some time. `expo install --check` therefore reports them as
      # wanting a "downgrade" — that is the expected state here, not a finding,
      # and it is why that check is not a CI gate. Do not "fix" it by pulling
      # these back to the SDK's set without a device pass.
      #
      # Moved as a set: reanimated 4.5.3, worklets 0.10.3,
      # nitro-modules 0.36.5, pager-view 8.0.4, keyboard-controller 1.22.2.
      # Note worklets stays on the 0.10 line deliberately — expo-modules-core
      # 57.0.10 peers it at `^0.7.4 || ^0.8.0 || ^0.9.0 || ^0.10.0` and rejects
      # 0.11.x, while reanimated 4.5.3 accepts `0.10.x - 0.11.x`. Taking the
      # 0.11 that Dependabot will keep offering installs *both*, which for a
      # native module means two ABIs in one binary.
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-worklets
      - dependency-name: react-native-nitro-modules
      - dependency-name: react-native-pager-view
      - dependency-name: react-native-keyboard-controller
      # Nitro *consumers*. They belong to the set above even though none of
      # them is nitro-modules itself: each ships C++ pre-generated by a
      # specific nitrogen, so the version that matters is the one it was
      # generated against, not its own. Against our override-pinned
      # nitro-modules 0.36.5, code generated by a newer nitrogen calls a C++
      # surface that isn't installed — nitro-image 0.15.2 and
      # vision-camera 5.2.3 both moved to nitrogen 0.37.0, and 5.2.3 fails the
      # Android NDK build outright on `'NitroModules/ReactProp.hpp' file not
      # found`.
      #
      # Nothing expresses the coupling: they declare
      # `react-native-nitro-modules: "*"` as a peer, so the resolver sees no
      # conflict, and the failure surfaces only in a native build — which is
      # why CI's JS-only gates went green when 5.2.3 landed. Their specs are
      # pinned exactly (not caret) for the same reason: a caret range lets any
      # lockfile refresh pull the mismatched patch back in.
      #
      # These move as one reviewed set with nitro-modules, with a device build.
      - dependency-name: react-native-nitro-image
      - dependency-name: react-native-vision-camera
      - dependency-name: react-native-vision-camera-barcode-scanner
      # expo-image is the same lockstep case, but it bites at *launch* rather
      # than at build: with EXPO_USE_PRECOMPILED_MODULES its XCFramework is
      # downloaded prebuilt, so it is linked against whatever
      # expo-modules-core existed when Expo published it — never against ours.
      # Nothing catches this: expo-image declares no dependency on
      # expo-modules-core, and each artifact is fetched per-package.
      #
      # Now at 57.0.2 against core 57.0.10, which is the pairing it
      # was built for — 57.0.2 needs the module-lifecycle API (didCreate,
      # didStartListening, didStopListening, willDestroy) that core gained in
      # 57.0.9. Still pinned exactly, and still moves only when the SDK does.
      - dependency-name: expo-image
      # Same lockstep class as expo-image: 57.0.2's iOS source calls
      # `SceneGeometry.keyWindow()`, a helper expo-modules-core only gained in
      # 57.0.11. This tree is aligned on 57.0.10 — verified: the installed core
      # has no ios/Utilities/SceneGeometry.swift at all — so the Swift compile
      # fails outright. Nothing declares the coupling (expo-screen-capture peers
      # `expo: "*"` and depends on nothing), so taking it means moving core,
      # which means moving the SDK. Revisit when the SDK moves.
      - dependency-name: expo-screen-capture
      # Inert while the `expo-build-properties: 57.0.9` override stands — pnpm
      # resolves the direct spec through the override, so Dependabot has been
      # reopening a bump that cannot change what installs. Move it with the
      # override, or not at all.
      - dependency-name: expo-build-properties

  # Fastlane's gem tree ships the iOS release lane, so an advisory there reaches
  # a signing machine. Nothing else watches apps/mobile/Gemfile.lock — `pnpm
  # audit` in pre-merge only covers npm — so without this a bumped gem silently
  # rots back.
  - package-ecosystem: bundler
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      bundler:
        patterns:
          - "*"

  # Pin GitHub Actions by SHA; Dependabot rewrites the SHA and updates the
  # trailing version comment so reviewers can see the human-readable bump.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # pnpm/action-setup v6 ignores both `version:` input and `packageManager`
      # field, always installing pnpm 11-rc, which corrupts pnpm 10 lockfiles
      # in memory (pnpm/action-setup#225, #227, #228). Stay on v5 until fixed.
      - dependency-name: pnpm/action-setup
        update-types: [version-update:semver-major]
