name: Security / Scorecard

# OpenSSF Scorecard — runs ~19 automated checks against the repo's
# security posture (pinned deps, branch protection, token permissions,
# dangerous-workflow patterns, etc.) and publishes the results to the
# public Scorecard API so downstream consumers can verify posture
# independently.
#
# Results are uploaded to the GitHub Security tab (same place CodeQL
# reports) so triage happens in one dashboard.

on:
  branch_protection_rule:
  schedule:
    # Weekly — Tuesday 08:00 UTC, offset from Dependabot + SBOM so the
    # findings reflect a quiescent tree rather than mid-merge state.
    - cron: "0 8 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      # Upload SARIF to the code-scanning dashboard.
      security-events: write
      # Publish results to api.securityscorecards.dev via OIDC.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Public repo: surfaces the score on the public Scorecard API
          # and unlocks the "OpenSSF Scorecard" badge. Flip to false if
          # the repo ever goes private.
          publish_results: true

      # Retain the raw SARIF on the run for 14 days in case the Security
      # tab upload is throttled or we need to diff findings offline.
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 14

      - name: Upload to code-scanning dashboard
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
