name: Security / SBOM

# Generates a CycloneDX Software Bill of Materials for the resolved
# dependency tree. Runs on every push to main and weekly so there's
# always a recent SBOM available for vendor questionnaires, vulnerability
# correlation, and SLSA evidence.

on:
  push:
    branches: [main]
  schedule:
    # Mondays 07:00 UTC — a day before Dependabot runs so the SBOM
    # reflects the pre-bump state that Dependabot will diff against.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # syft reads pnpm-lock.yaml and workspace package.json files directly,
      # so it resolves our pnpm tree without invoking `npm ls` (which chokes
      # on pnpm's hoisting, catalogs, and strict peer-dep layout).
      - name: Generate SBOM (JSON + XML)
        run: |
          mkdir -p sbom
          syft scan dir:. \
            --source-name pera-react-native \
            --source-version "$GITHUB_SHA" \
            -o cyclonedx-json@1.6=sbom/bom.json \
            -o cyclonedx-xml@1.6=sbom/bom.xml

      - name: Summarize SBOM
        run: |
          {
            echo "## SBOM summary"
            echo ""
            echo "- Components: $(jq '.components | length' sbom/bom.json)"
            echo "- Spec version: $(jq -r '.specVersion' sbom/bom.json)"
            echo "- Serial: $(jq -r '.serialNumber' sbom/bom.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
          retention-days: 90
