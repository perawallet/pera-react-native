name: Linear / Release Sync

# A green release build moves the Pera (PER) tickets named in its commit subjects:
#
#   nightly (alpha) or rc  -> In QA, assigned to QA
#   store (vX.Y.Z)         -> Done, only from In QA or a later state
#
# The range is the previous tag on the same channel (tools/release/tickets.sh), so
# a ticket reaches QA with the first build that can be installed to test it.
# "The release shipped" is read from the check run Bitrise's GitHub integration
# posts, so no Linear credential lives in Bitrise. Tickets with no commit are
# never touched and are moved by hand.

on:
  check_run:
    types: [completed]
  # Re-run a release's ticket sync by tag, e.g. after fixing credentials.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v8.0.0-rc.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    name: Sync tickets for a shipped release
    # check_run fires for every check on every commit, so filter early: only
    # Bitrise, only success.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.check_run.app.slug == 'bitrise' &&
        github.event.check_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: the range starts at the previous tag on the channel.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # A check run is attached to a commit, not a ref, so the tag is recovered
      # from the SHA. No release tag there means it was not a release build.
      - name: Resolve the release tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ github.event.check_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_TAG" ]; then
            candidates="$DISPATCH_TAG"
          else
            candidates=$(git tag --points-at "$HEAD_SHA" --sort=-v:refname)
          fi
          tag=$(printf '%s\n' "$candidates" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|rc)\.[0-9]+)?$' | head -1 || true)
          if [ -z "$tag" ]; then
            echo "No release tag on ${HEAD_SHA:-${DISPATCH_TAG}} — nothing to sync"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Release tag: ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Move delivered tickets
        if: steps.tag.outputs.tag != ''
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_KEY: PER
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            *-alpha.* | *-rc.*)
              target="In QA"
              # Eric (QA). His Linear username, resolved to a user id at run
              # time; anything other than one active match skips the assignment.
              export LINEAR_ASSIGNEE=eric.wollaeger
              ;;
            *)
              target="Done"
              # Forward-only is not enough: In Progress is behind Done too, and
              # closing work QA has not had would be wrong.
              export LINEAR_MIN_FROM_STATUS="In QA"
              ;;
          esac
          tickets=()
          while IFS= read -r key; do
            tickets+=("$key")
          done < <(./tools/release/tickets.sh "$TAG")
          if [ "${#tickets[@]}" -eq 0 ]; then
            echo "No PER tickets in ${TAG} — nothing to sync"
            exit 0
          fi
          echo "${#tickets[@]} ticket(s) delivered by ${TAG}"
          ./tools/linear-sync.sh "$target" "${tickets[@]}"
