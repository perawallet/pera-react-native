name: Release / RC

# Mints a vX.Y.Z-rc.N tag every other Friday and pushes it. The pushed tag fires
# Bitrise's `v.*` release-builds pipeline (test → TestFlight + Firebase,
# production + staging) — same path as the nightly alpha tags, just on the rc
# channel and the same base version. Idempotent: tools/create-nightly-tag.sh
# exits without tagging when there are no new commits since the last rc tag.

on:
  schedule:
    # Fridays 10:00 UTC; the `slot` job drops the off-weeks, since cron cannot
    # express a fortnightly cadence. GitHub cron is UTC-only (no DST).
    - cron: "0 10 * * 5"
  # Allow cutting an rc on demand from the Actions tab.
  workflow_dispatch: {}

# Least-privilege default; the mint job elevates to write so it can push.
permissions:
  contents: read

jobs:
  slot:
    name: Check fortnightly slot
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Decide whether this Friday is an rc week
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          # First bi-weekly rc; whole weeks elapsed from here must be even.
          ANCHOR: "2026-09-18"
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != schedule ]; then
            echo "Manual dispatch - cutting an rc regardless of the slot."
            echo "proceed=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Weeks on the epoch clock rather than ISO week numbers: a 53-week
          # year flips ISO parity and would stretch one gap to three weeks.
          weeks=$(( ( $(date -u +%s) - $(date -u -d "$ANCHOR" +%s) ) / 604800 ))
          if [ "$(( weeks % 2 ))" -eq 0 ]; then
            echo "Week $weeks since $ANCHOR - cutting an rc."
            echo "proceed=true" >>"$GITHUB_OUTPUT"
          else
            echo "Week $weeks since $ANCHOR - off-week, skipping."
            echo "proceed=false" >>"$GITHUB_OUTPUT"
          fi

  mint:
    name: Mint release-candidate tag
    needs: slot
    if: needs.slot.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: the script diffs against the last rc tag and
          # derives the next counter from existing v*-rc.* tags.
          fetch-depth: 0
          fetch-tags: true
          # Keep the GITHUB_TOKEN credential so the script's `git push` works.
          persist-credentials: true

      - name: Mint and push rc tag
        env:
          CHANNEL: rc
        run: ./tools/create-nightly-tag.sh
