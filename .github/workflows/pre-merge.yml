name: Pre-Merge

on:
  pull_request:

# Least-privilege default. Jobs that need more should override locally.
permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"

      # Fail fast if pnpm-lock.yaml drifted from package.json. Without this
      # step, a stale lockfile can silently install wrong versions on dev
      # machines (frozen-lockfile catches it but the error is cryptic).
      - name: Lockfile drift check
        run: |
          if ! pnpm install --lockfile-only --frozen-lockfile; then
            echo "::error::pnpm-lock.yaml is out of date with package.json files."
            echo "Run 'pnpm install' locally and commit the updated lockfile."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            extensions/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  audit:
    name: Audit
    runs-on: ubuntu-24.04
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"

      # Fail the build on any moderate+ vulnerability in runtime deps.
      # Dev-only advisories are reported but not blocking.
      - name: pnpm audit (runtime)
        run: pnpm audit --prod --audit-level=moderate

      - name: pnpm audit (all, informational)
        if: always()
        run: pnpm audit --audit-level=low || true

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            extensions/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies on cache miss
        run: test -d node_modules || pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: Prettier
        run: pnpm run format --check

      - name: Copyright Check
        run: pnpm run lint:copyright

      - name: i18n Check
        run: pnpm run lint:i18n

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            extensions/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies on cache miss
        run: test -d node_modules || pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Expo Prebuild
        run: pnpm --filter mobile expo:prebuild

      - name: Cache build artifacts
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            packages/*/dist
            extensions/*/dist
          key: build-artifacts-${{ runner.os }}-${{ github.sha }}

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            extensions/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies on cache miss
        run: test -d node_modules || pnpm install --frozen-lockfile

      - name: Restore build artifacts
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            packages/*/dist
            extensions/*/dist
          key: build-artifacts-${{ runner.os }}-${{ github.sha }}

      - name: Test
        run: pnpm run test:coverage

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # gitleaks scans history; need more than shallow clone
          fetch-depth: 0
          persist-credentials: false

      # Install gitleaks directly rather than using gitleaks/gitleaks-action.
      # The third-party action requires GITLEAKS_LICENSE for org repos; the
      # upstream binary is Apache-2.0 and has no such restriction.
      #
      # Supply-chain hardening: the tarball is verified against a pinned
      # SHA256. Bumping GITLEAKS_VERSION requires also updating the hash
      # (see https://github.com/gitleaks/gitleaks/releases — grab the
      # linux_x64 line from gitleaks_<ver>_checksums.txt).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xz -C /usr/local/bin -f "${tarball}" gitleaks
          rm "${tarball}"

      - name: Scan PR diff for secrets
        run: |
          gitleaks git \
            --config=.gitleaks.toml \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --redact \
            --verbose
