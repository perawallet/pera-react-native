name: CI / Pre-Merge

on:
  pull_request:

# Least-privilege default. Jobs that need more should override locally.
permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"

      # Fail fast if pnpm-lock.yaml drifted from package.json. Without this
      # step, a stale lockfile can silently install wrong versions on dev
      # machines (frozen-lockfile catches it but the error is cryptic).
      - name: Lockfile drift check
        run: |
          if ! pnpm install --lockfile-only --frozen-lockfile; then
            echo "::error::pnpm-lock.yaml is out of date with package.json files."
            echo "Run 'pnpm install' locally and commit the updated lockfile."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            extensions/*/node_modules
            conformance/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  audit:
    name: Audit
    runs-on: ubuntu-24.04
    needs: setup
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      # No `cache: pnpm` on any job below `setup`. setup-node's post-step saves
      # the pnpm store, and a job that never runs `pnpm install` never creates
      # it — saving a path that doesn't exist fails the job with "Path
      # Validation Error", *after* the real work has already passed. This job
      # never installs; the others restore node_modules from the cache `setup`
      # saved and so skip the install. Only `setup` installs unconditionally,
      # so only `setup` may cache the store.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".tool-versions"

      # Fail the build on any moderate+ vulnerability in runtime deps.
      # Dev-only advisories are reported but not blocking.
      # npm retired the legacy audit endpoints (410 Gone) and pnpm 10 never
      # got bulk-advisory support, so run just the audit through pnpm 11
      # until the repo moves to pnpm 11 (pnpm/pnpm#11265).
      - name: pnpm audit (runtime)
        run: >
          pnpm dlx --config.minimumReleaseAge=0 pnpm@11.13.0
          --pm-on-fail=ignore --config.manage-package-manager-versions=false
          audit --prod --audit-level=moderate

      - name: pnpm audit (all, informational)
        if: always()
        run: >
          pnpm dlx --config.minimumReleaseAge=0 pnpm@11.13.0
          --pm-on-fail=ignore --config.manage-package-manager-versions=false
          audit --audit-level=low || true

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    needs: setup
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      # No `cache: pnpm` here — see the audit job's Setup Node.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".tool-versions"

      - name: Restore node_modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            extensions/*/node_modules
            conformance/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies on cache miss
        run: test -d node_modules || pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: Prettier
        run: pnpm run format --check

      - name: Copyright Check
        run: pnpm run lint:copyright

      - name: i18n Check
        run: pnpm run lint:i18n

      # Lockfile-only, so it belongs on the cheap job. Two resolved algosdk
      # copies break `instanceof Transaction`/`instanceof Address` and msgpack
      # identity across the algokit-utils boundary, and a
      # resolution below the catalog's PQ floor silently costs quantum accounts
      # the ability to sign. Until now this ran only in tools/pre-push, which
      # the documented `--no-fail-on-error` invocation makes non-blocking.
      - name: Single algosdk resolution
        run: pnpm run check:single-algosdk

  # Blocking static analysis: unused code, circular dependencies, and code
  # duplication via fallow. Findings are surfaced in the job summary and fail
  # the PR (the step exits with fallow's status).
  dead-code:
    name: Dead Code
    runs-on: ubuntu-24.04
    needs: setup
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      # No `cache: pnpm` here — see the audit job's Setup Node.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".tool-versions"

      - name: Restore node_modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            extensions/*/node_modules
            conformance/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies on cache miss
        run: test -d node_modules || pnpm install --frozen-lockfile

      - name: fallow (unused code, cycles, duplication)
        run: |
          # Disable -e so the report renders even when fallow finds issues; the
          # step's pass/fail is taken from fallow's own exit code at the end.
          set +e
          pnpm exec fallow --skip health --quiet --format compact > fallow-report.txt 2>&1
          fallow_exit=$?
          {
            echo "## fallow report"
            echo ""
            echo "Unused code, circular dependencies, and duplication."
            echo ""
            echo "| issue | count |"
            echo "|-------|------:|"
            grep -oE '^[a-z][a-z-]+' fallow-report.txt | sort | uniq -c | sort -rn \
              | awk '{ printf "| %s | %s |\n", $2, $1 }'
            echo ""
            echo "<details><summary>All findings</summary>"
            echo ""
            echo '```'
            cat fallow-report.txt
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "fallow findings by category:"
          grep -oE '^[a-z][a-z-]+' fallow-report.txt | sort | uniq -c | sort -rn
          exit $fallow_exit

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: setup
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      # No `cache: pnpm` here — see the audit job's Setup Node.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".tool-versions"

      - name: Restore node_modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            extensions/*/node_modules
            conformance/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies on cache miss
        run: test -d node_modules || pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      # Type-aware lint (no-floating-promises / no-misused-promises) resolves
      # cross-package types via each package's built dist/*.d.ts, so it must run
      # after `pnpm run build`. Running it in the Lint job (no build) makes
      # workspace types degrade to `any` and produces false positives.
      - name: Type-aware Lint
        run: pnpm run lint:types

      - name: Check no test-only modules leaked into prod bundles
        run: pnpm run lint:bundle

      - name: Expo Prebuild
        run: pnpm --filter mobile expo:prebuild

      - name: Cache build artifacts
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/*/dist
            extensions/*/dist
          key: build-artifacts-${{ runner.os }}-${{ github.sha }}

  test:
    name: Test (${{ matrix.shard.name }})
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
    strategy:
      # Surface every shard's failures in one run rather than cancelling
      # siblings on the first red.
      fail-fast: false
      matrix:
        # The suite is CPU-bound on a 4-core runner, so the win comes from more
        # runners rather than more threads per runner. Grouped by measured cost
        # (locally, cache forced, CI thread caps) so no one shard sets the floor:
        #   background 67s | rest 57s | mobile-unit 44s | heavy 33s | mobile-int 27s
        # `core-background` runs alone because it alone is ~26% of package test
        # time, and it does NOT get faster with more threads (67s at 2, 74s at
        # 4) — its suite doesn't parallelize, so it only needs its own runner.
        # Together these cover every test task exactly once: 1 + 3 + 49 package
        # tasks, plus mobile's two vitest projects (4094 + 351 = the full run).
        shard:
          - name: packages-background
            command: pnpm exec turbo run test --filter=@perawallet/wallet-core-background
            vitestThreads: 2
            turboConcurrency: 1
          - name: packages-rest
            command: >-
              pnpm exec turbo run test --filter='!mobile'
              --filter='!@perawallet/wallet-core-background'
              --filter='!@perawallet/wallet-core-signing'
              --filter='!@perawallet/wallet-core-card'
              --filter='!@perawallet/wallet-core-accounts'
            vitestThreads: 2
            turboConcurrency: 4
          - name: packages-heavy
            command: >-
              pnpm exec turbo run test
              --filter=@perawallet/wallet-core-signing
              --filter=@perawallet/wallet-core-card
              --filter=@perawallet/wallet-core-accounts
            vitestThreads: 2
            turboConcurrency: 3
          - name: mobile-unit
            command: pnpm --filter mobile test:unit
            vitestThreads: 4
            turboConcurrency: 1
          - name: mobile-integration
            command: pnpm --filter mobile test:integration
            vitestThreads: 4
            turboConcurrency: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      # No `cache: pnpm` here — see the audit job's Setup Node.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".tool-versions"

      - name: Restore node_modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            extensions/*/node_modules
            conformance/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies on cache miss
        run: test -d node_modules || pnpm install --frozen-lockfile

      - name: Restore build artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/*/dist
            extensions/*/dist
          key: build-artifacts-${{ runner.os }}-${{ github.sha }}

      # The root `test` script front-loads these; the shard commands below call
      # vitest/turbo directly, so run them here instead.
      - name: Prepare native modules and config
        run: |
          bash tools/rebuild-native.sh
          bash tools/generate-config.sh

      - name: Test
        env:
          # GitHub-hosted ubuntu-24.04 runners have 4 cores, so each shard
          # budgets threads against that. The `packages` shard fans out through
          # turbo — without caps each of its ~30 sibling vitest processes would
          # grab cpu_count threads and over-subscribe wildly, the symptom being
          # intermittent timeouts in CPU-heavy specs (guardrails'
          # runner.spec.ts, which `spawnSync`s pnpm and spawns its own
          # worker_threads). 2 threads × 4 turbo tasks = 8 active threads, which
          # fits 4 cores with headroom. The mobile shards run a single vitest
          # process, so that process gets the whole runner.
          VITEST_MAX_THREADS: ${{ matrix.shard.vitestThreads }}
          TURBO_CONCURRENCY: ${{ matrix.shard.turboConcurrency }}
        # Coverage is deliberately absent: nothing consumed the report on the PR
        # path (no thresholds, no upload), so instrumenting the whole monorepo
        # only slowed the gate down. Run `pnpm test:coverage` locally or from a
        # scheduled workflow when a report is actually wanted.
        run: ${{ matrix.shard.command }}

  # Single stable check for the sharded matrix above, so branch protection can
  # keep requiring "Test" without enumerating shard names. Fails if any shard
  # did not succeed (including cancelled/skipped).
  test-result:
    name: Test
    runs-on: ubuntu-24.04
    needs: test
    if: always()
    steps:
      - name: Verify every shard passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "Test shards did not all pass (matrix result: $RESULT)"
            exit 1
          fi
          echo "All test shards passed"

  extension-e2e:
    name: Extension bundle & e2e
    runs-on: ubuntu-24.04
    needs: setup
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The bundle pulls in workspace packages (see the `...browser` filter in
      # `Build packages`), so this cannot key off `apps/browser/**` alone — a
      # `packages/**` change breaks the bundle just as easily. Fails safe by
      # inverting the test: skip ONLY when every changed path provably cannot
      # reach the extension build graph (apps/mobile and docs are not in it —
      # verified: mobile is absent from `turbo run build --filter=...browser`
      # and nothing under extensions/ imports it). Anything else, including a
      # path this list has never seen, runs the job.
      - name: Detect changes affecting the extension
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          files=$(gh api --paginate "repos/${REPO}/pulls/${PR}/files" --jq '.[].filename')
          if [ -z "$files" ]; then
            echo "No file list returned — running the job rather than assuming."
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Paths that cannot affect the extension bundle.
          irrelevant='^(apps/mobile/|docs/|[^/]*\.md$)'
          # Filtered once into a variable, then printed with a herestring.
          # Piping the filter straight into `head` sent SIGPIPE to `grep` the
          # moment `head` had its 20 lines, and under `pipefail` that failed
          # the step outright on any PR with more than 20 relevant files.
          # Counted rather than `grep -q`: with -v, BSD and GNU grep disagree on
          # the exit status, so a count is the only form that means the same
          # thing on a dev machine and on the runner.
          relevant_files=$(printf '%s\n' "$files" | grep -vE "$irrelevant" || true)
          relevant=$(printf '%s\n' "$relevant_files" | grep -c . || true)
          if [ "${relevant:-0}" -gt 0 ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            echo "Extension-relevant changes ($relevant):"
            head -20 <<< "$relevant_files"
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
            echo "Only mobile/docs paths changed — skipping the extension bundle and e2e."
          fi

      - name: Install pnpm
        if: steps.changes.outputs.affected == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      # No `cache: pnpm` here — see the audit job's Setup Node.
      - name: Setup Node
        if: steps.changes.outputs.affected == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".tool-versions"

      - name: Restore node_modules
        if: steps.changes.outputs.affected == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            extensions/*/node_modules
            conformance/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies on cache miss
        if: steps.changes.outputs.affected == 'true'
        run: test -d node_modules || pnpm install --frozen-lockfile

      - name: Bundle extension
        if: steps.changes.outputs.affected == 'true'
        run: pnpm --filter browser bundle

      # Keyed on the lockfile hash (same idiom as the node_modules/build-artifact
      # caches above) since @playwright/test is pinned via a semver range, not an
      # exact version. `playwright install` is idempotent, so a stale/missing
      # cache just falls back to a full download instead of failing.
      - name: Cache Playwright browsers
        if: steps.changes.outputs.affected == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.changes.outputs.affected == 'true'
        run: pnpm --filter browser exec playwright install --with-deps chromium

      - name: Run extension e2e
        if: steps.changes.outputs.affected == 'true'
        run: pnpm --filter browser test:e2e

      - name: Upload fidelity screenshots
        if: always() && steps.changes.outputs.affected == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-fidelity-screenshots
          path: apps/browser/screenshots/
          retention-days: 14

      - name: Upload traces on failure
        if: failure() && steps.changes.outputs.affected == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-e2e-traces
          path: apps/browser/test-results/
          retention-days: 7

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans history; need more than shallow clone
          fetch-depth: 0
          persist-credentials: false

      # Install gitleaks directly rather than using gitleaks/gitleaks-action.
      # The third-party action requires GITLEAKS_LICENSE for org repos; the
      # upstream binary is Apache-2.0 and has no such restriction.
      #
      # Supply-chain hardening: the tarball is verified against a pinned
      # SHA256. Bumping GITLEAKS_VERSION requires also updating the hash
      # (see https://github.com/gitleaks/gitleaks/releases — grab the
      # linux_x64 line from gitleaks_<ver>_checksums.txt).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xz -C /usr/local/bin -f "${tarball}" gitleaks
          rm "${tarball}"

      - name: Scan PR diff for secrets
        run: |
          gitleaks git \
            --config=.gitleaks.toml \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --redact \
            --verbose

  ci-lint:
    name: CI Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      # No `cache: pnpm` here — same reasoning as the audit job above: this
      # job never runs `pnpm install`, so there is no store to cache.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".tool-versions"

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xz -C /usr/local/bin -f "${tarball}" actionlint
          rm "${tarball}"

      # Also shellchecks every `run:` block, since shellcheck ships with the image.
      - name: Lint workflows
        run: actionlint

      # error severity only, for now. The five pre-existing warnings are real, but
      # two are in tools/generate-config.sh on the production config path and want
      # their own change with a test rather than a drive-by fix.
      - name: Lint shell scripts
        run: |
          set -euo pipefail
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=error

      # These cover tools/jira-sync.sh and tools/previous-release-tag.sh, which
      # only ever run unattended and write to a live tracker.
      - name: Shell script tests
        run: |
          set -euo pipefail
          for suite in tools/__tests__/*.test.sh; do
            echo "── ${suite}"
            bash "${suite}"
          done

      # The shell harness above only exercises synthetic fixtures; this checks
      # the real pnpm-workspace.yaml for patch/catalog drift.
      - name: Check patch pins
        run: pnpm run check:patch-pins
