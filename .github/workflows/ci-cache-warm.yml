name: CI / Cache Warm

# A PR can only restore a cache saved on its own branch or on main, and
# pre-merge runs on PRs alone, so without this every PR's first extension
# bundle starts from a cold Metro cache. Builds from an empty cache on purpose:
# Metro never prunes its file store, so restoring and re-saving would grow it
# forever, while each PR's own chain starts from this fresh one.

on:
  schedule:
    # ~02:00 UTC daily, between Nightly Tag (01:00) and Conformance (03:00).
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  metro:
    name: Metro cache
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle extension
        env:
          # Expo keeps Metro's cache under os.tmpdir(); ci-pre-merge.yml
          # restores it from the same place.
          TMPDIR: ${{ runner.temp }}
        run: pnpm --filter browser bundle

      - name: Save Metro cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/metro-cache
          key: metro-web-${{ runner.os }}-${{ github.sha }}
