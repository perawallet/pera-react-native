patchedDependencies:
  # The engine has no secp256k1 path: `deriveFromSeed` only derives
  # BIP32-Ed25519 from an `hd-root-key`, and `sign`/`import` know no secp256k1
  # type. The patch routes `curve: 'secp256k1'` to the provider's shim: the
  # child is derived from an HD wallet's BIP39 entropy and sealed at birth,
  # signing opens only that child, and imported raw keys are sealed too, and
  # released by `export` only when imported extractable; derived children never
  # are. Drop once upstream takes these branches.
  "@algorandfoundation/keystore-core@1.0.0-canary.5": patches/@algorandfoundation__keystore-core@1.0.0-canary.5.patch
  # `shims` is typed as an array, though it is handed unchanged to keystore-core's
  # `createKeyStore`, which also takes a lazy function. The provider needs the
  # lazy form to fold the asynchronously loaded native Falcon binding in next to
  # the secp256k1 shim. Type-only; drop once upstream widens it.
  # Some StrongBox chips take about a second per AES operation, and every
  # master-key read costs two, so a slow read gets a TEE-held copy of the same
  # master key that later reads prefer; the StrongBox copy is never removed.
  # Needs the react-native-keychain patch's TEE storage. Drop once upstream can
  # keep a key out of StrongBox.
  "@algorandfoundation/react-native-keystore@1.0.0-canary.21": patches/@algorandfoundation__react-native-keystore@1.0.0-canary.21.patch
  # Six unrelated reasons, none configurable through plugin options:
  # - The Android credential provider keeps the legacy native app's service
  #   class name, so Credential Manager carries the user's enablement across
  #   the upgrade.
  # - Android WebAuthn registration through a browser: an allowlisted browser's
  #   clientDataHash is honoured (upstream honours it only on assertion), and the
  #   response carries the authenticatorData / publicKeyAlgorithm / publicKey
  #   fields without which Chrome rejects it. Drop the fields once upstream
  #   ships them.
  # - The package's iOS strings name its own product ("Rocca"), including the
  #   Face ID usage text and the biometric / passcode prompt reasons.
  # - Android credentials live in the keystore's `k/`+`m/` split layout: the
  #   credential chooser lists plaintext `k/` metadata without decrypting
  #   anything, and one credential's sealed `m/` material is opened only after
  #   the user selects it. Upstream lists flat records by opening each one.
  # - Android assertion keys open only under a Keystore-enforced proof that the
  #   user authenticated: a biometric-wrapped key is never re-derived, and
  #   re-deriving a key or reading the PRF parent secret needs a biometric
  #   cipher the user unlocked. Upstream re-derives any key it cannot open.
  # - expo-modules-core 58 removed `AppContext.hostingRuntimeContext`, the
  #   module's fallback after `reactContext`; the Android build fails on it.
  "@algorandfoundation/react-native-passkey-autofill@1.0.0-canary.29": patches/@algorandfoundation__react-native-passkey-autofill@1.0.0-canary.29.patch
  # The CJS build's Emscripten glue reads a bare `__filename`, which a Metro web
  # bundle never defines, so evaluating it throws a ReferenceError. The value
  # only seeds a script-directory lookup the inlined WASM never uses; guard it
  # with `typeof`. Drop once upstream's build stops emitting the bare read.
  "falcon-1024@0.2.0": patches/falcon-1024@0.2.0.patch
  # RN 0.87 removed InteractionManager (undefined in release, a throw in dev),
  # and the list calls it whenever its data's keys change, i.e. on every
  # reorder. requestIdleCallback is RN's documented replacement. Patches the
  # two builds Metro reads (`src` on native, `lib/module` on web); tests mock
  # the package. Drop once upstream ships a release without it.
  "react-native-draggable-flatlist@4.0.3": patches/react-native-draggable-flatlist@4.0.3.patch
  # Type-only: 14.0.1 defaults the class's extra-props generic to `undefined`,
  # so `WebViewProps & undefined` is `never` and every JSX prop fails to
  # type-check. 13.x defaulted it to `{}`. Drop once upstream restores it.
  "react-native-webview@14.0.1": patches/react-native-webview@14.0.1.patch
  # RN 0.88 removed the legacy `RCTBaseTextInputView.h`; the Swift bridging
  # header still imports it though no source uses the class. Drop once
  # upstream ships a release without the import.
  "react-native-advanced-input-mask@1.4.6": patches/react-native-advanced-input-mask@1.4.6.patch
  # Android: adds the `KeystoreAESGCM_NoAuth_TEE` storage, whose key is never
  # generated in StrongBox; upstream always prefers StrongBox when the device
  # has it (oblador/react-native-keychain#817). Only chosen by name, never by
  # default.
  "react-native-keychain@10.0.0": patches/react-native-keychain@10.0.0.patch
  # Android: ScreenFragment.onDestroy never clears Screen.fragmentWrapper, and
  # Fabric's tagToViewState keeps the Screen view alive for the surface's
  # lifetime, so every dismissed screen's fragment (plus its view subtree) is
  # retained — LeakCanary flags a handful per navigation session. Clears the
  # back-reference on destroy ONLY when the screen is gone from its container:
  # below-top fragments are destroyed on push and the same instance re-attaches
  # on pop without addScreen re-running, so an unconditional clear would strand
  # reused screens (software-mansion/react-native-screens#3755). Drop once
  # upstream ships the fix.
  "react-native-screens@4.30.0": patches/react-native-screens@4.30.0.patch

overrides:
  # No `algosdk` override: official 3.7.0 satisfies @algorandfoundation/
  # algokit-utils' `^3.5.2` peer on its own, so the catalog range alone yields a
  # single copy. (A prerelease never satisfied that peer by semver, which is why
  # the vendored build had to be forced here.) One copy is still load-bearing —
  # two break cross-boundary `instanceof Transaction`/`instanceof Address` and
  # msgpack schema identity — so tools/check-single-algosdk.mjs keeps asserting
  # it on every pre-push.

  # No @algorandfoundation/keystore override, and no catalog entry either:
  # keystore-chrome vendors the canary.17 key types and error class its WebAuthn
  # signer uses (src/keystore/), so nothing in the workspace depends on this
  # package. The catalog pin was
  # dropped because it resolved to nothing in the lockfile — no importer, no
  # resolution — leaving Dependabot to bump a spec no consumer used and no test
  # could validate.
  '@algorandfoundation/keystore-core': 1.0.0-canary.5
  '@algorandfoundation/keystore-web': 1.0.0-canary.6
  '@algorandfoundation/react-native-keystore': 1.0.0-canary.21
  # Four upstream packages (keystore-core, keystore@canary.17,
  # provider-migrations, react-native-keystore) pin `wallet-provider` at exact
  # `1.0.0-canary.5`, so bumping the catalog alone can't drag them forward and
  # yields two installed copies. `wallet-provider` exports `Provider` as a
  # class, so two copies break cross-boundary `instanceof` the same way a
  # second algosdk copy would. Forcing it here is safe only because canary.5
  # and canary.6's dists are byte-identical (verified with `diff -r` between
  # the two installed copies) — retire this override once those four
  # packages move past canary.5.
  # While this override stands the catalog entry above is inert — pnpm resolves
  # 'catalog:' through the override, so bumping line 16 alone changes nothing.
  # Move both together, or not at all.
  '@algorandfoundation/wallet-provider': 1.0.0-canary.6
  '@expo/dom-webview': 58.0.2
  # Force the SDK-bundled versions across the tree. Both reach us only
  # transitively with floating ranges that drift past the installed SDK:
  # expo-asset pulls `expo-constants` through a tilde range and
  # react-native-quick-crypto declares an optional `expo-build-properties: *`
  # peer — each resolves to the newest published patch, spawning a
  # second copy that diverges from the prebuilt native pods. The duplicate
  # expo-constants specifically breaks the iOS "Generate app.config for
  # prebuilt Constants.manifest" archive phase. A direct spec can't hold these
  # down (the float is inside the dependents' ranges), so pin them here.
  expo-constants: 58.0.13
  # One copy only, for the same reason as algosdk and wallet-provider: two
  # @types/react mean two ref/JSX type universes, and
  # `React.ComponentRef<typeof PWFlatList>` collapses to `never` the moment a
  # second one appears — apps/mobile's FlashList refs stop type-checking and
  # `mobile#build` fails.
  # It splits on its own: @types/react-native 0.70.x (reached through
  # @gorhom/bottom-sheet) asks for @types/react over a much wider range than
  # the catalog, so it only takes a few more peer contexts in the graph — the
  # ones @rneui/base 5.0.0 adds by declaring @testing-library/jest-native and
  # @testing-library/react-native as non-optional peers — for pnpm to stop
  # collapsing the two ranges into one resolution. Mirroring the catalog range
  # here gives every consumer the same spec, so it resolves once. Move this
  # with the catalog entry, not on its own.
  '@types/react': ~19.3.0
  expo-build-properties: 58.0.11
  # GHSA-m9gg-hp2v-232j floor. @firebase/firestore still declares ~1.9.0 and
  # 1.9.x has no patched release, so this forces it past its range; safe
  # because grpc-js is only loaded by firestore's Node entry, which no bundle
  # here reaches (the browser and RN builds use webchannel).
  '@grpc/grpc-js@<1.13.6': 1.13.6
  # Single copy across the expo config-plugin toolchain; 0.8.15 is the
  # GHSA-6gmq-8vp8-gcm6 floor (XML fragment injection, patched >=0.8.15).
  # Stay on the 0.8 line — 0.9 changed the package's API surface.
  '@xmldom/xmldom': 0.8.15
  esbuild@<0.25.0: ">=0.25.0"
  # GHSA-g7r4-m6w7-qqqr (arbitrary file read via the dev server on Windows).
  esbuild@>=0.27.3 <0.28.1: ">=0.28.1"
  # GHSA-7p8r-x3mc-p8w7 (host confusion via backslash authority introducer),
  # then GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf and
  # GHSA-jqff-g426-hqxp (host confusion / SSRF via IDN, IPv6 and
  # percent-decoding normalization), patched in 4.1.3; then GHSA-qw65-cvwx-89v3
  # (authority injection via an unvalidated port) and GHSA-58mr-gqgx-xq4g (host
  # confusion via an unclosed bracket), patched in 4.1.4; then
  # GHSA-hrr3-gc8f-f4qj and GHSA-jvvf-x445-j334 (mailto header injection),
  # patched in 4.1.5; then GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr,
  # GHSA-xhq7-xmqj-769h and GHSA-333x-w4r6-6crp (scheme spoofing, host
  # confusion, path equivalence, scheme injection), patched in 4.2.3. Pinned to
  # the lowest patched version rather than latest.
  fast-uri@<4.2.3: 4.2.3
  happy-dom@>=19.0.0 <20.0.2: '>=20.0.2'
  # The 4.x consumers already resolve to 5.x through this open range; the floor
  # names the patched 5.x so a stale lock entry cannot hold them below it.
  js-yaml@>=4.0.0 <4.3.1: '>=5.4.1'
  # Keep the production-proven resolution: in the tree since #996 and shipped in
  # v7.0.0. Deliberately outside @gorhom/portal's declared `^3.3.1`.
  '@gorhom/portal>nanoid': 6.0.0
  picomatch@3: 3.0.1
  picomatch@4: 4.0.4
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.0
  react-native-nitro-modules: 0.36.5
  react-native-quick-base64: ^3.0.0
  react-native-quick-crypto: ^1.0.17
  uuid@<14: 14.0.0
  ws@>=7.0.0 <7.5.11: 7.5.11
  ws@>=8.0.0 <8.20.1: '>=8.20.1'
  yaml@2: 2.8.3
  # GHSA-mrhx-c7xc-m3w5 floor for every 4.x copy, so that advisory's audit
  # ignore can only ever cover the unpatchable 3.x line.
  zod@>=4.0.0 <4.6.6: ^4.6.7

supportedArchitectures:
  cpu: [x64, arm64]
  os: [win32, darwin, current]
