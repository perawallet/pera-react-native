minimumReleaseAge: 10080

# image-size has no patched release: GitHub reports first_patched_version: null
# on both advisories and npm's latest is 2.0.2 (Apr 2025), so there is nothing to
# override to. It reaches the --prod graph only because react-native declares
# @react-native/community-cli-plugin as a runtime dep; the sole consumer is
# metro's build-time asset sizer (metro/src/Assets.js), never shipped to a
# device. Exploiting it means committing a malformed ICNS/JXL/HEIF to our own
# assets to stall a bundle. Drop these two once image-size publishes a fix.
auditConfig:
  ignoreGhsas:
    - GHSA-5p2g-fcmc-qvqq # image-size: JXL/HEIF parsers infinite loop
    - GHSA-w3rx-r6r6-pgpr # image-size: ICNS parser infinite loop
    # decode-uri-component DoS via malformed percent-encoding. Reaches us only
    # through @react-navigation/core → query-string@7 → getStateFromPath, and
    # no NavigationContainer here has a `linking` config, so the vulnerable
    # decode never executes (the app parses deeplinks with its own parser).
    # Unfixable by override: the advisory's ">=0.4.3" names versions that were
    # never published, and the only real patched release (0.5.0) is ESM-only —
    # query-string@7's CJS require gets the module namespace instead of the
    # function and throws at parse time (verified under Node 24; Metro's babel
    # interop breaks the same way). Drop this entry when the react-navigation
    # chain resolves a patched version itself — and revisit immediately if a
    # `linking` config is ever added.
    - GHSA-vcc3-ghjq-m6fr # decode-uri-component: exponential-time decoding

minimumReleaseAgeExclude:
  # @algorandfoundation/keystore is deliberately NOT listed: nothing in the
  # workspace depends on it (extensions/keystore-chrome vendors the flat
  # canary.17 API locally), so it needs no freshness exemption of its own.
  # keystore-core and keystore-web ARE direct dependencies that share the
  # keystore canary publish date, so they keep their exemption independent of
  # the removed keystore pin: keystore-core is consumed by
  # extensions/provider, extensions/passkey-autofill, packages/kms and
  # packages/passkeys; keystore-web only by extensions/provider.
  # keystore-node is not listed: it arrives transitively, and its own
  # canary.3 publish (2026-08-13) already clears the 7-day minimumReleaseAge
  # window unaided, so no exclude entry is needed for it either.
  - '@algorandfoundation/keystore-core'
  - '@algorandfoundation/keystore-web'
  - '@algorandfoundation/provider-migrations'
  - '@algorandfoundation/react-native-keystore'
  - '@algorandfoundation/react-native-passkey-autofill'
  - '@joe-p/react-native-falcon'
  - '@perawallet/walletconnect'
  # TEMPORARY — delete this entry (and this comment) after 2026-08-26 17:13 UTC,
  # when 3.7.0 clears the 7-day window on its own. Present only so the PQ floor
  # above could land the day the release shipped. Verified before adding:
  # published by the same github-actions[bot] CI path as 3.6.0, npm signature
  # present, no pre/postinstall scripts, and the maintainer set gained exactly
  # one name — joe-p (Joe Polny), an Algorand Foundation engineer who also
  # maintains @algorandfoundation/algokit-utils and authored the PQ PR this
  # bump is for.
  - algosdk
  - falcon-1024
  - fast-uri
  # 3.3.18 is the GHSA-2v37-7h3g-55p8 fix and is younger than the 7-day gate.
  # Same sole maintainer (ai <andrey@sitnik.es>) as 3.3.17, no install scripts,
  # SLSA provenance on both.
  - nanoid
  - expo
  - expo-*
  - '@expo/*'
  - babel-preset-expo
  # TEMPORARY — delete these five entries and this comment after 2026-09-05
  # 14:16 UTC, when 0.8.1 clears the 7-day window unaided. Verified before
  # adding: no install scripts of any kind; the platform binaries arrive as
  # optionalDependencies rather than a postinstall download; npm signature and
  # SLSA provenance attestation both present.
  - 'lanekeep'
  - '@lanekeep/darwin-arm64'
  - '@lanekeep/linux-arm64'
  - '@lanekeep/linux-x64'
  - '@lanekeep/win32-x64'

