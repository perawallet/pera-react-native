minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - '@algorandfoundation/keystore'
  - '@algorandfoundation/react-native-keystore'
  - '@algorandfoundation/react-native-passkey-autofill'
  - '@joe-p/algosdk'
  - '@joe-p/react-native-falcon'
  - falcon-1024
  - fast-uri
  - expo
  - expo-*
  - '@expo/*'
  - babel-preset-expo
  # Security patches for GHSA-mh99-v99m-4gvg / GHSA-pm4m-ph32-ghv5 published
  # 2026-07-23, inside the 7-day window. Same maintainers as the prior
  # releases (juliangruber+isaacs / vitaly), no install scripts.
  - brace-expansion
  - js-yaml

# GHSA-mh99-v99m-4gvg (brace-expansion OOM DoS) marks every release <=5.0.7
# vulnerable and 5.0.8 is the only patched version. The 1.x/2.x lines that
# minimatch@3/@9 consumers (eslint, glob, @expo/cli) default-import have no
# patched release yet, and 5.0.8 can't be substituted in — it only ships a
# named `expand` export, so a v1/v2 override breaks minimatch at runtime.
# The 3.x-5.x resolutions ARE pinned to 5.0.8 via overrides below. Drop this
# ignore once upstream ships patched 1.x/2.x releases and bump the @1/@2
# overrides instead.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg

onlyBuiltDependencies:
  - '@firebase/util'
  - '@tailwindcss/oxide'
  - better-sqlite3
  - electron
  - electron-winstaller
  - es5-ext
  - esbuild
  - msw
  - protobufjs
  - react-native-nitro-modules
  - sharp
  - simple-git-hooks

patchedDependencies:
  "@algorandfoundation/react-native-passkey-autofill@1.0.0-canary.22": patches/@algorandfoundation__react-native-passkey-autofill@1.0.0-canary.22.patch
  # jsi 57.0.2+ added JavaScriptCodable+Date.swift, whose `abs(milliseconds)` on line 53 is
  # ambiguous under the Bitrise Xcode 26.2 Swift/C++-interop toolchain (fails the ExpoModulesJSI
  # xcframework build). No published jsi version fixes it (57.0.2/3/4 are identical here);
  # qualify to Swift.abs to disambiguate. Drop once Expo ships a toolchain-compatible release.
  "expo-modules-jsi@57.0.3": patches/expo-modules-jsi@57.0.3.patch

overrides:
  '@algorandfoundation/keystore': 1.0.0-canary.17
  '@algorandfoundation/react-native-keystore': 1.0.0-canary.13
  '@babel/plugin-transform-modules-systemjs@>=7.12.0 <7.29.4': '>=7.29.4'
  '@expo/dom-webview': ~57.0.1
  '@grpc/grpc-js@<1.9.16': 1.9.16
  '@react-native/metro-config': 0.86.0
  '@xmldom/xmldom': 0.8.13
  bn.js@4: 4.12.3
  brace-expansion@1: 1.1.16
  brace-expansion@2: 2.1.2
  brace-expansion@3: 5.0.8
  brace-expansion@4: 5.0.8
  brace-expansion@5: 5.0.8
  esbuild@<0.25.0: ">=0.25.0"
