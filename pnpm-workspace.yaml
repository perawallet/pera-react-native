packages:
  - apps/*
  - packages/*
  - extensions/*

catalog:
  "@algorandfoundation/algokit-utils": 9.2.0
  "@algorandfoundation/keystore": 1.0.0-canary.17
  "@algorandfoundation/ledger-algorand-js": ^1.4.3
  "@algorandfoundation/react-native-keystore": 1.0.0-canary.13
  "@algorandfoundation/react-native-passkey-autofill": 1.0.0-canary.22
  "@algorandfoundation/wallet-provider": 1.0.0-canary.5
  "@algorandfoundation/xhd-wallet-api": ^2.0.0-canary.1
  "@babel/runtime": ^7.29.2
  "@expo/app-integrity": ~57.0.0
  "@ledgerhq/errors": ^6.35.0
  "@ledgerhq/react-native-hid": ^6.39.1
  "@noble/hashes": ^1.8.0
  "@notifee/react-native": ^9.1.8
  "@playwright/test": ^1.53.0
  "@react-native-firebase/analytics": ^25.1.0
  "@react-native-firebase/app": ^25.1.0
  "@react-native-firebase/crashlytics": ^25.1.0
  "@react-native-firebase/messaging": ^25.1.0
  "@react-native-firebase/remote-config": ^25.1.0
  "@scure/bip39": ^2.2.0
  "@tanstack/query-async-storage-persister": ^5.99.0
  "@tanstack/react-query": ^5.99.0
  "@tanstack/react-query-persist-client": ^5.99.0
  "@tanstack/store": ^0.11.0
  "@testing-library/react": 16.3.2
  "@types/chrome": ^0.0.328
  "@types/node": ^20.19.39
  "@types/react": ~19.2.14
  "@vitejs/plugin-react": 6.0.3
  "@vitest/coverage-v8": ^4.1.9
  "@xstate/react": ^6.1.0
  algosdk: ^3.5.2
  before-after-hook: ^4.0.0
  decimal.js: ^10.6.0
  drizzle-orm: ^0.45.2
  esbuild: ^0.25.0
  eslint: 9.39.4
  eslint-plugin-unused-imports: 4.4.1
  expo: ^57.0.2
  expo-application: ~57.0.0
  expo-device: ~57.0.0
  expo-local-authentication: ~57.0.0
  expo-localization: ~57.0.0
  expo-sqlite: ~57.0.0
  fast-glob: ^3.3.2
  jsdom: ^27.4.0
  ky: ^2.0.2
  oxfmt: ^0.57.0
  # Must equal react-native 0.86.0's bundled renderer version. RN does an exact
  # React.version match at runtime, so a looser bump (e.g. 19.2.7) → red-screen
  # "Incompatible React versions". Keep in lockstep with the override below.
  # Expo SDK 57 / RN 0.86 still bundle 19.2.3, so this stays put.
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.0
  react-native-mmkv: ^4.2.0
  react-native-quick-base64: ^3.0.0
  react-native-ssl-public-key-pinning: ^1.2.6
  tsx: ^4.22.3
  tweetnacl: ^1.0.3
  typescript: ^5.9.3
  util: ^0.12.5
  uuid: 14.0.1
  msw: ^2.14.6
  vite: ^8.0.8
  vite-plugin-dts: ^5.0.0
  vitest: ^4.1.9
  xstate: ^5.28.0
  zod: ^4.4.3
  zustand: ^5.0.12

onlyBuiltDependencies:
  - "@firebase/util"
  - "@tailwindcss/oxide"
  - better-sqlite3
  - electron
  - electron-winstaller
  - es5-ext
  - esbuild
  - msw
  - protobufjs
  - react-native-nitro-modules
  - sharp
  - simple-git-hooks

patchedDependencies:
  "@algorandfoundation/react-native-passkey-autofill@1.0.0-canary.22": patches/@algorandfoundation__react-native-passkey-autofill@1.0.0-canary.22.patch

overrides:
  "@algorandfoundation/keystore": 1.0.0-canary.17
  # Force a single react-native-keystore across the tree. react-native-passkey-autofill
  # transitively pins canary.12 (which still exports the old get-or-create getMasterKey);
  # without this the app resolves two versions and the readMasterKey call is undefined
  # at runtime. Its keystore dep is unused at runtime, so forcing it up is safe.
  "@algorandfoundation/react-native-keystore": 1.0.0-canary.13
  "@babel/plugin-transform-modules-systemjs@>=7.12.0 <7.29.4": ">=7.29.4"
  "@expo/dom-webview": ~57.0.0
  # Security backport for GHSA-5375-pq7m-f5r2 + GHSA-99f4-grh7-6pcq (DoS).
  # Pinned exactly, NOT ">=", so it stays inside @firebase/firestore's
  # "~1.9.0" range — 1.10+ would break Firestore's resolution.
  "@grpc/grpc-js@<1.9.16": 1.9.16
  "@xmldom/xmldom": 0.8.13
  bn.js@4: 4.12.3
  brace-expansion@1: 1.1.13
  brace-expansion@2: 2.0.3
  brace-expansion@3: 3.0.2
  brace-expansion@4: 5.0.6
  brace-expansion@5: 5.0.6
  esbuild@<0.25.0: ">=0.25.0"
  # GHSA-g7r4-m6w7-qqqr (arbitrary file read via the dev server on Windows).
  esbuild@>=0.27.3 <0.28.1: ">=0.28.1"
  fast-uri@<3.1.2: ">=3.1.2"
  flatted@3: 3.4.2
  glob@>=10.2.0 <10.5.0: ">=10.5.0"
  happy-dom@<20.0.0: ">=20.0.0"
  happy-dom@>=19.0.0 <20.0.2: ">=20.0.2"
  js-yaml@<3.14.2: ">=3.14.2"
  # GHSA-h67p-54hq-rp68 (quadratic-complexity DoS); 4.1.1 is now vulnerable too.
  js-yaml@>=4.0.0 <4.2.0: ">=4.2.0"
  lodash@4: 4.18.1
  nanoid@<3.3.8: ">=3.3.8"
  node-fetch@<2.6.7: ">=2.6.7"
  node-forge@1: 1.4.0
  picomatch@2: 2.3.2
  picomatch@3: 3.0.1
  picomatch@4: 4.0.4
  postcss@<8.5.10: ">=8.5.10"
  # GHSA-wcpc-wj8m-hjx6 + GHSA-f38q-mgvj-vph7 (DoS / property shadowing).
  # Was 7.5.8, now vulnerable. Pinned exact to the verified lowest patched 7.x.
  protobufjs@7: 7.6.3
  # Pinned to react-native 0.86.0's bundled renderer (19.2.3); see catalog note.
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.0
  "@react-native/metro-config": 0.86.0
  # Pin every nitro consumer (mmkv keystore, quick-crypto, reanimated, vision-camera +
  # its nitro-image peer) to one native ABI version — leaving it at 0.35.7 splits the
  # tree into 0.35.7 + 0.35.9. nitro-image 0.15.1 is built against 0.35.9.
  react-native-nitro-modules: 0.35.9
  react-native-quick-crypto: ^1.0.17
  react-native-quick-base64: ^3.0.0
  uuid@<14: 14.0.0
  # GHSA-96hv-2xvq-fx4p (memory-exhaustion DoS); 7.5.10 is now vulnerable.
  # Pinned exact (NOT ">="), since 7.5.11 is the last 7.x and ">=" would jump to 8.x.
  ws@>=7.0.0 <7.5.11: 7.5.11
  ws@>=8.0.0 <8.20.1: ">=8.20.1"
  yaml@1: 1.10.3
  yaml@2: 2.8.3

supportedArchitectures:
  cpu: [x64, arm64]
  os: [win32, darwin, current]

# Supply-chain hardening: wait 7 days before a new version is allowed.
# Catches compromised/malicious packages that typically get yanked quickly.
minimumReleaseAge: 10080
# Packages exempt from the freshness window, and why:
#   @algorandfoundation/keystore, react-native-keystore, react-native-passkey-autofill
#     — in-progress first-party canaries pinned to specific versions.
#   expo / expo-* / @expo/* / babel-preset-expo
#     — active SDK 57 line: Expo ships frequent same-SDK patch releases (57.0.x)
#       that we want to adopt immediately rather than wait out the window.
#       Revisit once SDK 57 patch cadence settles.
minimumReleaseAgeExclude:
  - "@algorandfoundation/keystore"
  - "@algorandfoundation/react-native-keystore"
  - "@algorandfoundation/react-native-passkey-autofill"
  - expo
  - "expo-*"
  - "@expo/*"
  - babel-preset-expo
