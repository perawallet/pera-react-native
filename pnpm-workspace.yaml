  '@tanstack/react-query-persist-client': ^5.90.9
  '@tanstack/store': ^0.8.1
  '@testing-library/react': 16.3.2
  '@types/react': ~19.2.14
  '@vitejs/plugin-react': 6.0.1
  '@vitest/coverage-v8': ^4.1.4
  '@xstate/react': ^6.1.0
  before-after-hook: ^4.0.0
  bip39: ^3.1.0
  decimal.js: ^10.6.0
  drizzle-orm: ^0.45.2
  eslint: 9.39.4
  eslint-plugin-unused-imports: 4.4.1
  globals: 15.15.0
  oxfmt: ^0.41.0
  react: 19.2.5
  react-dom: 19.2.5
  typescript: ^5.9.3
  typescript-eslint: 8.58.2
  util: ^0.12.5
  uuid: 13.0.0
  vite: ^8.0.8
  vitest: ^4.1.4
  xstate: ^5.28.0
  zod: ^4.3.6
  zustand: ^5.0.12

onlyBuiltDependencies:
  - '@firebase/util'
  - '@tailwindcss/oxide'
  - electron
  - electron-winstaller
  - es5-ext
  - esbuild
  - msw
  - protobufjs
  - react-native-nitro-modules
  - sharp
  - simple-git-hooks

overrides:
  '@algorandfoundation/keystore': 1.0.0-canary.12
  '@xmldom/xmldom': 0.8.12
  bn.js@4: 4.12.3
  brace-expansion@1: 1.1.13
  brace-expansion@2: 2.0.3
  brace-expansion@3: 3.0.2
  brace-expansion@4: 5.0.5
  brace-expansion@5: 5.0.5
  esbuild@<0.25.0: '>=0.25.0'
  flatted@3: 3.4.2
  glob@>=10.2.0 <10.5.0: '>=10.5.0'
  happy-dom@<20.0.0: '>=20.0.0'
  happy-dom@>=19.0.0 <20.0.2: '>=20.0.2'
  js-yaml@<3.14.2: '>=3.14.2'
  js-yaml@>=4.0.0 <4.1.1: '>=4.1.1'
  lodash@4: 4.18.1
  nanoid@<3.3.8: '>=3.3.8'
  node-fetch@<2.6.7: '>=2.6.7'
  node-forge@1: 1.4.0
  picomatch@2: 2.3.2
  picomatch@3: 3.0.1
  picomatch@4: 4.0.4
  protobufjs@7: 7.5.5
  react-dom: 19.2.5
  react-native: 0.83.2
  react-native-nitro-modules: 0.35.0
  react-native-quick-crypto: ^1.0.17
  react-native-quick-base64: ^2.2.2
  ws@>=7.0.0 <7.5.10: 7.5.10
  yaml@1: 1.10.3
  yaml@2: 2.8.3

supportedArchitectures:
  cpu: [x64, arm64]
  os: [win32, darwin, current]

# Supply-chain hardening: wait 7 days before a new version is allowed.
# Catches compromised/malicious packages that typically get yanked quickly.
minimumReleaseAge: 10080
# Security-mandated versions exempt from the freshness window.
# protobufjs 7.5.5 is the only patched release for GHSA-xq3m-2v4x-88gg.
minimumReleaseAgeExclude:
  - protobufjs
