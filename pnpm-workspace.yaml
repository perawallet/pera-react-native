minimumReleaseAge: 10080

# image-size has no patched release: GitHub reports first_patched_version: null
# on both advisories and npm's latest is 2.0.2 (Apr 2025), so there is nothing to
# override to. It reaches the --prod graph only because react-native declares
# @react-native/community-cli-plugin as a runtime dep; the sole consumer is
# metro's build-time asset sizer (metro/src/Assets.js), never shipped to a
# device. Exploiting it means committing a malformed ICNS/JXL/HEIF to our own
# assets to stall a bundle. Drop these two once image-size publishes a fix.
auditConfig:
  ignoreGhsas:
    - GHSA-5p2g-fcmc-qvqq # image-size: JXL/HEIF parsers infinite loop
    - GHSA-w3rx-r6r6-pgpr # image-size: ICNS parser infinite loop

minimumReleaseAgeExclude:
  - '@algorandfoundation/keystore'
  # keystore-core is a direct dependency; keystore-node and keystore-web arrive
  # transitively via the meta-package, which hard-depends on every platform
  # sibling. They share the canary publish date, so excluding only the direct
  # one leaves the install still blocked by the gate.
  - '@algorandfoundation/keystore-core'
  - '@algorandfoundation/react-native-keystore'
  - '@algorandfoundation/react-native-passkey-autofill'
  - '@joe-p/react-native-falcon'
  - falcon-1024
  - fast-uri
  # 3.3.17 is the GHSA-2v37-7h3g-55p8 fix and is younger than the 7-day gate.
  # Same sole maintainer (ai <andrey@sitnik.es>) as 3.3.16, no install scripts.
  - nanoid
  - expo
  - expo-*
  - '@expo/*'
  - babel-preset-expo

onlyBuiltDependencies:
  - '@firebase/util'
  - '@tailwindcss/oxide'
  - better-sqlite3
  - electron
  - electron-winstaller
  - es5-ext
  - esbuild
  - msw
  - protobufjs
  - react-native-nitro-modules
  - sharp
  - simple-git-hooks

patchedDependencies:
  "@algorandfoundation/react-native-passkey-autofill@1.0.0-canary.22": patches/@algorandfoundation__react-native-passkey-autofill@1.0.0-canary.22.patch
  # jsi 57.0.2+ added JavaScriptCodable+Date.swift, whose `abs(milliseconds)` on line 53 is
  # ambiguous under the Bitrise Xcode 26.2 Swift/C++-interop toolchain (fails the ExpoModulesJSI
  # xcframework build). No published jsi version fixes it (57.0.2/3/4 are identical here);
  # qualify to Swift.abs to disambiguate. Drop once Expo ships a toolchain-compatible release.
  "expo-modules-jsi@57.0.4": patches/expo-modules-jsi@57.0.4.patch

overrides:
  # Force ONE algosdk across the whole tree, including inside
  # @algorandfoundation/algokit-utils. Two copies would break cross-boundary
  # `instanceof Transaction` / `instanceof Address` checks and msgpack schema
  # identity between algokit-utils and our own code. (algokit-utils declares
  # algosdk as a `^3.5.2` PEER, which a prerelease does not satisfy by semver;
  # pnpm does not warn here because the override resolves to a tarball.)
  #
  # This is the vendored build of upstream v3.7.0-beta.1 — see the `algosdk`
  # catalog entry above and tools/vendor-algosdk.sh. It cannot be a git spec:
  # the tag ships no dist/ (only the ESM `type` marker), and pnpm rewrites
  # `github:`/`git+https:` to a codeload tarball and then refuses to run the
  # package's build — "has to be built but the build scripts were ignored" —
  # regardless of `onlyBuiltDependencies` or `dangerouslyAllowAllBuilds`. A git
  # spec installs a package with no entry points at all.
  algosdk: file:./libs/algosdk-3.7.0-beta.1.tgz
  '@algorandfoundation/keystore': 1.0.0-canary.17
  '@algorandfoundation/keystore-core': 1.0.0-canary.1
  '@algorandfoundation/react-native-keystore': 1.0.0-canary.14
  '@babel/plugin-transform-modules-systemjs@>=7.12.0 <7.29.4': '>=7.29.4'
  '@expo/dom-webview': ~57.0.1
  '@grpc/grpc-js@<1.9.16': 1.9.16
  '@xmldom/xmldom': 0.8.13
  bn.js@4: 4.12.3
  # GHSA-rgw5-rvv9-x895 is patched per major line, not by one version: the 1.x
  # and 2.x consumers (minimatch@3/@9 via eslint, glob, @expo/cli) default-import
  # brace-expansion, and 5.x only ships a named `expand` export — so they have to
  # stay on their own patched lines rather than all pointing at 5.0.9.
  brace-expansion@1: 1.1.18
  brace-expansion@2: 2.1.4
  brace-expansion@3: 5.0.9
  brace-expansion@4: 5.0.9
  brace-expansion@5: 5.0.9
  esbuild@<0.25.0: ">=0.25.0"
  # GHSA-g7r4-m6w7-qqqr (arbitrary file read via the dev server on Windows).
  esbuild@>=0.27.3 <0.28.1: ">=0.28.1"
  # GHSA-7p8r-x3mc-p8w7 (host confusion via backslash authority introducer).
  fast-uri@<4.1.2: ">=4.1.2"
  flatted@3: 3.4.2
  glob@>=10.2.0 <10.5.0: '>=10.5.0'
  happy-dom@<20.0.0: '>=20.0.0'
  happy-dom@>=19.0.0 <20.0.2: '>=20.0.2'
  js-yaml@<3.14.2: '>=3.14.2'
  js-yaml@>=4.0.0 <4.3.1: '>=4.3.1'
  js-yaml@>=5.0.0 <5.2.2: '>=5.2.2'
  lodash@4: 4.18.1
  # GHSA-2v37-7h3g-55p8 (custom generators loop forever when size is 0). Exact
  # target, not '>=3.3.17': an open range resolves to nanoid 6.
  #
  # pnpm matches this selector against the *declared* spec, not the resolved
  # version, so `^3.3.1` is captured too — which is how the old '>=3.3.8' entry
  # silently pulled @gorhom/portal up to nanoid 6. That resolution shipped in
  # v7.0.0 and is not vulnerable (the advisory is <3.3.17), so it is pinned below
  # rather than dragged back to 3.x by this line.
  nanoid@<3.3.17: 3.3.17
  # Keep the production-proven resolution: in the tree since #996 and shipped in
  # v7.0.0. Deliberately outside @gorhom/portal's declared `^3.3.1`.
  '@gorhom/portal>nanoid': 6.0.0
  node-fetch@<2.6.7: '>=2.6.7'
  node-forge@1: 1.4.0
  picomatch@2: 2.3.2
  picomatch@3: 3.0.1
  picomatch@4: 4.0.4
  # GHSA-fxqj-rqcc-2cmp (arbitrary .map file read via sourceMappingURL when `from` is unset).
  postcss@<8.5.23: '>=8.5.23'
  protobufjs@7: 7.6.5
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.2
  react-native-nitro-modules: 0.36.5
  react-native-quick-base64: ^3.0.0
  react-native-quick-crypto: ^1.0.17
  shell-quote@<1.9.0: 1.9.0
  # Stay on the v3 line: @svgr/plugin-svgo declares svgo ^3.0.2 and configures
  # `removeViewBox`, which svgo v4 dropped from preset-default. An open
  # `>=3.3.4` here resolved to 4.x and made every SVG import log a
  # "trying to configure removeViewBox" warning during bundling.
  svgo@>=3.0.0 <3.3.4: ^3.3.4
  uuid@<14: 14.0.0
  ws@>=7.0.0 <7.5.11: 7.5.11
  ws@>=8.0.0 <8.20.1: '>=8.20.1'
  yaml@1: 1.10.3
  yaml@2: 2.8.3

supportedArchitectures:
  cpu: [x64, arm64]
  os: [win32, darwin, current]
