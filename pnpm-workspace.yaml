patchedDependencies:
  # `getMasterKey` read-then-generates the vault master key with no locking, so
  # every context that builds a driver (service worker, offscreen document,
  # each extension page — all of which construct one within milliseconds at
  # first run) can miss the read, generate its own AES-GCM key, and race the
  # `put`. Last write wins the record while each context keeps the key IT made
  # cached in the driver closure, so material sealed by one can never be opened
  # by another. It surfaces as a bare `OperationError` with no message —
  # "Pera couldn't read this request" on a legitimate dApp signing request, and
  # the intermittent half of apps/browser/e2e/dapp-sign.spec.ts. Creation now
  # happens under a Web Lock with a re-read once held, so the first caller
  # creates and the rest read what it wrote. Drop once upstream takes it.
  "@algorandfoundation/keystore-web@1.0.0-canary.3": patches/@algorandfoundation__keystore-web@1.0.0-canary.3.patch
  # Three unrelated reasons. The Android credential provider keeps the legacy
  # native app's service class name so Credential Manager carries the user's
  # enablement across the upgrade, relying-party scoping so the credential
  # provider doesn't hand every stored passkey to any caller (PERA-4714), and
  # every user-facing string the package ships names "Rocca Wallet" — its own
  # product, shown verbatim in the iOS Face ID / passcode prompts. None of the
  # three is configurable through plugin options.
  # canary.26 shipped the derivedParentSecret fix upstream (parent.bytes), so
  # that hunk is dropped rather than carried forward.
  "@algorandfoundation/react-native-passkey-autofill@1.0.0-canary.26": patches/@algorandfoundation__react-native-passkey-autofill@1.0.0-canary.26.patch
  # jsi 57.0.2+ added JavaScriptCodable+Date.swift, whose `abs(milliseconds)` on line 53 is
  # ambiguous under the Bitrise Xcode 26.2 Swift/C++-interop toolchain (fails the ExpoModulesJSI
  # xcframework build). No published jsi version fixes it (57.0.2/3/4 are identical here);
  # qualify to Swift.abs to disambiguate. Drop once Expo ships a toolchain-compatible release.
  "expo-modules-jsi@57.0.4": patches/expo-modules-jsi@57.0.4.patch

overrides:
  # No `algosdk` override: official 3.7.0 satisfies @algorandfoundation/
  # algokit-utils' `^3.5.2` peer on its own, so the catalog range alone yields a
  # single copy. (A prerelease never satisfied that peer by semver, which is why
  # the vendored build had to be forced here.) One copy is still load-bearing —
  # two break cross-boundary `instanceof Transaction`/`instanceof Address` and
  # msgpack schema identity — so tools/check-single-algosdk.mjs keeps asserting
  # it on every pre-push.

  # No @algorandfoundation/keystore override, and no catalog entry either:
  # keystore-chrome vendors the flat canary.17 API locally (src/keystore/), so
  # nothing in the workspace depends on this package. The catalog pin was
  # dropped because it resolved to nothing in the lockfile — no importer, no
  # resolution — leaving Dependabot to bump a spec no consumer used and no test
  # could validate.
  '@algorandfoundation/keystore-core': 1.0.0-canary.3
  '@algorandfoundation/keystore-web': 1.0.0-canary.3
  '@algorandfoundation/react-native-keystore': 1.0.0-canary.19
  # Four upstream packages (keystore-core, keystore@canary.17,
  # provider-migrations, react-native-keystore) pin `wallet-provider` at exact
  # `1.0.0-canary.5`, so bumping the catalog alone can't drag them forward and
  # yields two installed copies. `wallet-provider` exports `Provider` as a
  # class, so two copies break cross-boundary `instanceof` the same way a
  # second algosdk copy would. Forcing it here is safe only because canary.5
  # and canary.6's dists are byte-identical (verified with `diff -r` between
  # the two installed copies) — retire this override once those four
  # packages move past canary.5.
  # While this override stands the catalog entry above is inert — pnpm resolves
  # 'catalog:' through the override, so bumping line 16 alone changes nothing.
  # Move both together, or not at all.
  '@algorandfoundation/wallet-provider': 1.0.0-canary.6
  '@babel/plugin-transform-modules-systemjs@>=7.12.0 <7.29.4': '>=7.29.4'
  '@expo/dom-webview': ~57.0.1
  # Force the SDK-bundled versions across the tree. Both reach us only
  # transitively with floating ranges that drift past the installed SDK
  # (expo@57.0.11 bundles ~57.0.9): expo-asset pulls `expo-constants: ~57.0.9`
  # and react-native-quick-crypto declares an optional `expo-build-properties: *`
  # peer — each resolves to the newest published patch (57.0.11), spawning a
  # second copy that diverges from the prebuilt native pods. The duplicate
  # expo-constants specifically breaks the iOS "Generate app.config for
  # prebuilt Constants.manifest" archive phase. A direct spec can't hold these
  # down (the float is inside the dependents' ranges), so pin them here.
  expo-constants: 57.0.9
  expo-build-properties: 57.0.9
  '@grpc/grpc-js@<1.9.16': 1.9.16
  '@xmldom/xmldom': 0.8.13
  bn.js@4: 4.12.3
  # GHSA-rgw5-rvv9-x895 is patched per major line, not by one version: the 1.x
  # and 2.x consumers (minimatch@3/@9 via eslint, glob, @expo/cli) default-import
  # brace-expansion, and 5.x only ships a named `expand` export — so they have to
  # stay on their own patched lines rather than all pointing at 5.0.9.
  brace-expansion@1: 1.1.18
  brace-expansion@2: 2.1.4
  brace-expansion@3: 5.0.9
  brace-expansion@4: 5.0.9
  brace-expansion@5: 5.0.9
  esbuild@<0.25.0: ">=0.25.0"
  # GHSA-g7r4-m6w7-qqqr (arbitrary file read via the dev server on Windows).
  esbuild@>=0.27.3 <0.28.1: ">=0.28.1"
  # GHSA-7p8r-x3mc-p8w7 (host confusion via backslash authority introducer).
  fast-uri@<4.1.2: ">=4.1.2"
  flatted@3: 3.4.2
  glob@>=10.2.0 <10.5.0: '>=10.5.0'
  happy-dom@<20.0.0: '>=20.0.0'
  happy-dom@>=19.0.0 <20.0.2: '>=20.0.2'
  js-yaml@<3.14.2: '>=3.14.2'
  js-yaml@>=4.0.0 <4.3.1: '>=4.3.1'
  js-yaml@>=5.0.0 <5.2.2: '>=5.2.2'
  lodash@4: 4.18.1
  # GHSA-2v37-7h3g-55p8 (custom generators loop forever when size is 0). Exact
  # target, not '>=3.3.18': an open range resolves to nanoid 6.
  #
  # 3.3.17 was an incomplete backport — it guarded the sync entrypoints but left
  # async/index.native.js unguarded, so GitHub re-ranged the advisory to <3.3.18
  # and our old pin became the vulnerable version. Check the advisory range, not
  # our last target, before assuming this line is still patched.
  #
  # pnpm matches this selector against the *declared* spec, not the resolved
  # version, so `^3.3.1` is captured too — which is how the old '>=3.3.8' entry
  # silently pulled @gorhom/portal up to nanoid 6. That resolution shipped in
  # v7.0.0 and is not vulnerable (the advisory covers <3.3.18 and >=4.0.0 <5.1.6,
  # and 6.x is outside both), so it is pinned below rather than dragged back to
  # 3.x by this line.
  nanoid@<3.3.18: 3.3.18
  # Keep the production-proven resolution: in the tree since #996 and shipped in
  # v7.0.0. Deliberately outside @gorhom/portal's declared `^3.3.1`.
  '@gorhom/portal>nanoid': 6.0.0
  node-fetch@<2.6.7: '>=2.6.7'
  node-forge@1: 1.4.0
  picomatch@2: 2.3.2
  picomatch@3: 3.0.1
  picomatch@4: 4.0.4
  # GHSA-fxqj-rqcc-2cmp (arbitrary .map file read via sourceMappingURL when `from` is unset).
  postcss@<8.5.23: '>=8.5.23'
  protobufjs@7: 7.6.5
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.2
  react-native-nitro-modules: 0.36.5
  react-native-quick-base64: ^3.0.0
  react-native-quick-crypto: ^1.0.17
  shell-quote@<1.9.0: 1.9.0
  # Stay on the v3 line: @svgr/plugin-svgo declares svgo ^3.0.2 and configures
  # `removeViewBox`, which svgo v4 dropped from preset-default. An open
  # `>=3.3.4` here resolved to 4.x and made every SVG import log a
  # "trying to configure removeViewBox" warning during bundling.
  svgo@>=3.0.0 <3.3.4: ^3.3.4
  uuid@<14: 14.0.0
  ws@>=7.0.0 <7.5.11: 7.5.11
  ws@>=8.0.0 <8.20.1: '>=8.20.1'
  yaml@1: 1.10.3
  yaml@2: 2.8.3

