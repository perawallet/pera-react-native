  # The `pqsig` field and scheme-agnostic PQ signer surface Pera's quantum
  # accounts need landed upstream as algorand/js-algorand-sdk v3.7.0-beta.1
  # (PR #1102, merged), which official 3.6.0 does not ship. That tag is not on
  # npm, so it is built from source and packed into libs/ by
  # tools/vendor-algosdk.sh, then wired in by the `algosdk` entry under
  # `overrides:` below. A catalog entry cannot hold a `file:` spec
  # (ERR_PNPM_CATALOG_ENTRY_INVALID_SPEC), so that override — not this line —
  # is the single place the vendored build is named.
  #
  # This range is inert while that override stands; it is what resolution
  # returns to on swap-back.
  # SWAP-BACK: when official algosdk 3.7.0 ships, set this to `^3.7.0` and
  # delete both the `algosdk` entry from `overrides:` and libs/. No source
  # changes are needed either way — algosdkPqSupport.spec.ts fails loudly if
  # the resolved build ever loses the PQ surface. Note a brand-new official
  # 3.7.0 sits inside the `minimumReleaseAge` window for its first 7 days, so
  # resolution will fail until the window passes — wait it out rather than
  # adding a permanent carveout for a package that no longer needs one.
  algosdk: ^3.6.0
  before-after-hook: ^4.0.0
  buffer: ^6.0.3
  decimal.js: ^10.6.0
  drizzle-orm: ^0.45.2
  esbuild: ^0.28.1
  eslint: 9.39.5
