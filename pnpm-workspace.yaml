packageExtensions:
  # The compat lists async-storage as a required peer for core's default
  # storage adapter. Pera injects its own (`packages/walletconnect/src/v2/storage.ts`),
  # and `ignoreMissing` only silences the warning: auto-install still adds the
  # package, and its presence re-keys every Firebase auth lockfile entry.
  # Optional peers are not auto-installed.
  '@walletconnect/react-native-compat':
    peerDependenciesMeta:
      '@react-native-async-storage/async-storage':
        optional: true

minimumReleaseAge: 10080

auditConfig:
  ignoreGhsas:
    # node-forge has no patched release (first_patched_version: null; npm's
    # latest is 1.4.0). Its only consumers are @expo/cli and
    # @expo/code-signing-certificates, dev/build tooling that never ships to a
    # device. Drop this entry once a fix lands.
    - GHSA-86w9-cpqp-85rv # node-forge: lax RSA PKCS#1 v1.5 signature verification
    # braces has no patched release (first_patched_version: null; npm's latest
    # is 3.0.3). Its only consumer is micromatch under metro-file-map and
    # @expo/metro-file-map, which match our own build globs, never user input,
    # and never ship to a device. Drop this entry once braces publishes a fix.
    - GHSA-vfj7-8cjw-p6xm # braces: stack exhaustion via deeply nested patterns
    # zod 3.x has no patched release (fixed only in 4.6.6). The only 3.x copy is
    # @expo/cli's, which never ships to a device; the zod override floors every
    # 4.x copy. Drop this entry once @expo/cli moves to zod 4.
    - GHSA-mrhx-c7xc-m3w5 # zod: memory exhaustion validating oversized arrays

minimumReleaseAgeExclude:
  # @algorandfoundation/keystore is deliberately NOT listed: nothing in the
  # workspace depends on it (extensions/keystore-chrome vendors the canary.17
  # key types it needs), so it needs no freshness exemption of its own.
  # keystore-core and keystore-web ARE direct dependencies that share the
  # keystore canary publish date, so they keep their exemption independent of
  # the removed keystore pin: keystore-core is consumed by
  # extensions/provider, extensions/passkey-autofill, packages/kms and
  # packages/passkeys; keystore-web only by extensions/provider.
  # keystore-node is not listed: it arrives transitively, and its own
  # canary.3 publish (2026-08-13) already clears the 7-day minimumReleaseAge
  # window unaided, so no exclude entry is needed for it either.
  - '@algorandfoundation/keystore-core'
  - '@algorandfoundation/keystore-web'
  - '@algorandfoundation/provider-migrations'
  - '@algorandfoundation/react-native-keystore'
  - '@algorandfoundation/react-native-passkey-autofill'
  - '@joe-p/react-native-falcon'
  - '@perawallet/walletconnect'
  - falcon-1024
  # First-party: sole maintainer fredamsouza, SLSA provenance on the launcher and
  # all four platform packages, no install scripts (checked for 0.12.0). Repeat
  # those checks before adopting a release younger than the gate.
  - lanekeep
  - '@lanekeep/*'
  - expo
  - expo-*
  - '@expo/*'
  - babel-preset-expo
  # Expo's Rust transformer, a hard dependency of @expo/metro-config. Published
  # from expo/noxcturnal by GitHub Actions trusted publishing, sole maintainer
  # philpl (also an `expo` maintainer), no install scripts in it or its
  # platform binaries. Inert here: it only runs under
  # `experiments.noxcturnalTransformWorker`, which a project with custom Babel
  # plugins can't use anyway.
  - noxcturnal
  - '@noxcturnal/*'
  # Apache Cordova's pbxproj editor, which @expo/config-plugins moved to ^4 in
  # the SDK 58 line; prebuild-only. 4.0.0 is byte-identical to the rel/4.0.0
  # tag, published by the same releaser as 3.0.1, no install scripts. Pinned
  # to the version so the next release clears the gate on its own.
  - xcode@4.0.0
  # Firebase Apple 13 is SPM-only and CocoaPods trunk goes read-only, so 27.0.0
  # is needed ahead of the gate. Same four maintainers as 26.x, SLSA provenance
  # on all five, and only `prepare` scripts, which a registry install never
  # runs. Pinned to the version so the next release clears the gate on its own.
  - '@react-native-firebase/analytics@27.0.0'
  - '@react-native-firebase/app@27.0.0'
  - '@react-native-firebase/crashlytics@27.0.0'
  - '@react-native-firebase/messaging@27.0.0'
  - '@react-native-firebase/remote-config@27.0.0'
  # The fast-uri audit floor (see the override). Same six fastify maintainers as
  # 4.1.5, SLSA provenance, no install scripts. Pinned to the version so it
  # stops applying once 4.2.3 clears the gate on its own.
  - fast-uri@4.2.3

