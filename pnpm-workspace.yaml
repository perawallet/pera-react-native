  js-yaml@>=5.0.0 <5.2.2: '>=5.2.2'
  lodash@4: 4.18.1
  nanoid@<3.3.8: '>=3.3.8'
  node-fetch@<2.6.7: '>=2.6.7'
  node-forge@1: 1.4.0
  picomatch@2: 2.3.2
  picomatch@3: 3.0.1
  picomatch@4: 4.0.4
  postcss@<8.5.18: '>=8.5.18'
  protobufjs@7: 7.6.5
